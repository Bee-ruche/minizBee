changement: |
  bee/bench/profil.py (6 lignes ajoutées, 2 retirées) : le nom capturé par DEBUT_FONCTION passe de
  [a-z_][a-z0-9_]* à [A-Za-z_][A-Za-z0-9_]*. Le reste de l'expression ne change pas : elle exige toujours un
  type devant le nom (un premier identifiant suivi d'une frontière de mot), donc un appel de macro en tête
  de ligne (MZ_ASSERT(…), TDEFL_PUT_BITS(…), TINFL_CR_RETURN(…), TINFL_CR_BEGIN) ne peut pas être pris
  pour un en-tête. Les mots-clés exclus deviennent un ensemble INSTRUCTIONS (if, else, while, for, do,
  switch, case, return, goto, sizeof, typedef), refusé comme nom (comme avant, liste élargie) et désormais
  aussi comme premier mot de la ligne : « else MZ_ASSERT(… » ou « return MZ_MAX(… » sans « ; » final ne
  passent plus pour la fonction MZ_ASSERT ou MZ_MAX. Format de sortie inchangé.

  bee/bench/test_profil.py (25 lignes ajoutées, aucune retirée) : l'exemple C gagne, après les cas
  existants (numéros de ligne inchangés), une macro sur plusieurs lignes dont une ligne commence par un
  appel de macro suivi d'une accolade (TINFL_CR_RETURN(etat, 1) puis « { ») et une autre par
  « else MZ_ASSERT(… », puis deux fonctions à majuscules : static LIRE_MOT16 et mz_exempleInit2 (en-tête
  sur deux lignes). Plages attendues et attribution des lignes (macros « hors fonction ») vérifiées.

  bee/README.md (10 ajoutées, 6 retirées) : commande de profilage avec make -B ; rappel de compiler le
  banc et de profiler dans la même session de bee/sandbox/sans-docker.sh (le dépôt y est monté à un autre
  chemin à chaque session, sinon tout part en « hors miniz » : je l'ai reproduit pendant ce travail, make
  sans -B ne recompile pas un banc d'une autre session) ; tableau de profil refait à a2f939a (il datait
  de 2948eeb) et une phrase sur ce que miniz-0034 change au profil.

  Avant/après (bee/resultats/miniz-0034/, hors décompte R1) : plages_de_fonctions() sur les trois
  sources de a2f939a, 13 plages ajoutées, aucune retirée ni déplacée : miniz.c mz_deflateInit 191-194,
  mz_deflateInit2 196-230, mz_deflateReset 232-239, mz_deflateEnd 299-309, mz_deflateBound 311-316,
  mz_compressBound 353-356, mz_inflateInit2 371-405, mz_inflateInit 407-410, mz_inflateReset 412-436,
  mz_inflateEnd 550-560 ; miniz_tdef.c TDEFL_READ_UNALIGNED_WORD 793-798, TDEFL_READ_UNALIGNED_WORD2
  799-804, TDEFL_READ_UNALIGNED_WORD32 947-952 (bornes vérifiées dans le source). Aucun appel de macro ni
  mot-clé dans la liste. Profil callgrind complet, mêmes fichiers attribués par les deux versions
  (--reutiliser) : totaux identiques (n1 169 368 921, n6 333 644 424, n9 481 644 530, décompression
  29 952 240 Ir) ; « miniz.c (hors fonction) » passe de 4 514 à 0 dans chaque scénario de compression
  (mz_deflateInit2 3 782, mz_deflateInit 427, mz_deflateEnd 305) et de 1 403 à 0 en décompression
