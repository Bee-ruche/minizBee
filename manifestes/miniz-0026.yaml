doutes: >
  1) api fige le comportement d'erreur actuel de miniz, écarts compris : une optimisation qui rapprocherait un code
  de celui de zlib (E5, E6, E7, E10, E12…) ferait échouer api. C'est voulu (le changement de comportement devient
  visible), mais il faudra alors mettre à jour l'attendu et la liste des écarts dans la même PR, avec relecture.
  2) Les attendus côté zlib sont ceux de zlib 1.3 ; si la CI change de version, des avertissements apparaîtront
  sans faire échouer le test, et la liste des écarts devra être revue. 3) Sous --sanitiseurs, lancer.sh dépasse
  déjà 30 s sur cette machine avant ce changement (34,6 s) ; api y ajoute environ 5 s. 4) bee/README.md n'est pas
  mis à jour (il ne mentionne ni api ni la quatrième étape de lancer.sh) : hors des fichiers de la tâche, à corriger
  à part. 5) La progression de couverture sur miniz_tdef.c et miniz_tinfl.c reste faible : ce n'est pas l'objet de
  la tâche, ces fichiers sont surtout exercés par le corpus et le fuzzing.
