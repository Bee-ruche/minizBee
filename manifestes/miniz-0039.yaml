resume: "tinfl_decompress : Adler-32 de la sortie par groupes de 160 octets (sommes par voie et sommes des sommes, voies de 16 bits), de 2,63 à 1,22 instruction par octet, mêmes entiers."
changement: >
  miniz_tinfl.c, fin de tinfl_decompress (calcul de l'Adler-32 de la sortie) seulement : 23 lignes
  ajoutées, aucune retirée. Une boucle par groupes de 160 octets est placée avant la boucle de 16
  octets de miniz-0016, dans le même #if MINIZ_LITTLE_ENDIAN && MINIZ_HAS_64BIT_REGISTERS ; la boucle
  de 16 octets reste pour le reste d'un bloc (moins de 160 octets), puis les boucles de 8 octets et
  octet par octet (chemin générique, inchangé). Les réductions modulo 65521 restent aux mêmes endroits
  (buf_len % 5552 octets, puis tous les 5552). Ni SIMD, ni en-tête, ni transtypage de pointeur : C
  portable, lectures par memcpy vers des variables locales.

  Algorithme. Un groupe fait 20 tours de 8 octets (10 itérations de deux mots w lus par memcpy). Par
  tour, avant d'ajouter le mot : pe += e et pz += z ; puis e += w & 0x00FF00FF00FF00FF (octets pairs,
  une voie de 16 bits par paire) et z += w >> 8. Soit 8 instructions par 8 octets, sans
  multiplication ni dépendance de s1 vers s2 dans la boucle. En fin de groupe : o = z - ((e >> 8) &
  ~0xFF) donne les sommes des octets impairs (pour chaque mot, w >> 8 = o + (e >> 8), car l'octet 0 <
  256 ; la somme reste exacte tant que la voie 0 de e tient en 16 bits), de même po à partir de pz et
  pe ; q replie pe et po en deux voies de 32 bits ; x = e + o. Puis s2 += 160 s1 + 8 P + H(e) + H(x) +
  2 [3,2,1,0].x et s1 += H(x), où P = somme des voies de q, H = somme des 4 voies (produit par
  0x0001000100010001) et [3,2,1,0].x = 3 x0 + 2 x1 + x2 (produit par 0x0003000200010000). Trois
  produits par groupe de 160 octets, contre six par tour de 16 octets avant.

  Pourquoi ce sont les mêmes entiers. Sur 160 octets b_t (t = 0 à 159), la boucle octet par octet fait
  s2 += 160 s1 + somme de (160 - t) b_t et s1 += somme des b_t. Avec t = 8 r + j (tour r de 0 à 19,
  rang j de 0 à 7), 160 - t = 8 (19 - r) + (8 - j). pe et po valent, par rang j, P_j = somme sur r de
  (19 - r) b_rj (chaque tour ajoute les sommes des tours précédents) ; e et o valent V_j = somme sur r
  de b_rj. Donc s2 += 160 s1 + 8 (somme des P_j) + somme de (8 - j) V_j, et somme de (8 - j) V_j =
  [8,6,4,2].e + [7,5,3,1].o = H(e) + H(x) + 2 [3,2,1,0].x. À la fin de chaque groupe, s1 et s2 sont
  ceux de la boucle octet par octet au même octet ; avant chaque réduction, ce sont les mêmes entiers.

  Bornes de débordement (voies de 16 bits, sans retenue d'une voie à l'autre). e et o : au plus 20 x
  255 = 5100 par voie ; pe et po : au plus 255 x (0 + 1 + ... + 19) = 48 450 < 65 536 ; x : 10 200 ;
  produit de e par 0x0001000100010001, voies (sommes partielles) au plus 20 400 ; de x, 40 800 ; de x
  par 0x0003000200010000, voies 0, x0, 2 x0 + x1, 3 x0 + 2 x1 + x2, au plus 61 200 ; les termes
  au-delà de 2^64 disparaissent sans toucher la voie haute. En entiers : z < 20 x 2^56 et pz < 190 x
  2^56 < 2^64. q : voies de 32 bits, au plus 4 x 48 450. s2 et s1 (32 bits) : tous les termes ajoutés
  sont positifs et leur total est la valeur de la boucle octet par octet, sous la borne de zlib sur
  5552 octets (< 2^32) : aucun repli. 20 tours est le plus grand nombre pour lequel 3 x0 + 2 x1 + x2
  tient en 16 bits (22 tours : 67 320).

  Instructions par octet de la zone (Cachegrind, scénario décompression d'ab.py, 128 premiers Kio de
  chaque fichier, 2 221 670 octets produits, banc en -O3 -DNDEBUG -g, mêmes totaux qu'ab.py) : avant
  2,634 (5 573 770 sur les lignes 682 à 730, plus 277 676 lectures par memcpy que Cachegrind range dans
  string_fortified.h), après 1,222 (2 702 511 sur les lignes 682 à 753, lectures des groupes
  comprises, plus environ 11 352 lectures du reste). Un groupe coûte environ 188 instructions pour 160
  octets (1,18 par octet) ; le reste de chaque bloc de 5552 octets (112 octets) garde la boucle de
  16 octets (2,5 par octet). Profil de miniz-0029 : la zone pesait 17,6 % du décompte du juge, 19,5 %
  de celui d'ab.py.

  D'où vient le gain mesuré. instructions_decompression baisse de 3 794 293 (-12,67 %) : la zone en
  donne 3 137 583 (-10,5 % du total) ; les 656 710 autres (-2,2 %) viennent d'ailleurs dans
  tinfl_decompress (surtout les lignes 427, 505, 516, 589, 606, 607 et 621 en baisse, 367 et 525 en
  hausse, et environ 25 000 lectures par memcpy de moins ailleurs) : gcc 13.3 alloue les registres et
  ordonne autrement cette très grande fonction. Ce n'est pas l'effet de l'algorithme, et un autre
  compilateur ou une autre architecture peut ne pas le reproduire (voir doutes). R4 tient avec la seule
  zone. Débit : la boucle n'a plus de multiplication ni de chaîne s1 -> s2 ; quatre accumulations
  indépendantes par mot.

  Variantes mesurées (prototype hors dépôt, Cachegrind, tampons de 128 Kio) : base 2,63 instructions
  par octet ; groupes de taille variable (n <= 10 itérations), 1,52 (gcc déroule mais teste la fin à
  chaque itération) ; quatre mots par itération, 1,48 ; groupes fixes de 160 octets, retenus, 1,33.
  10 itérations de 16 instructions restent sous la limite de gcc pour un déroulage complet : la boucle
  n'a plus de compteur.
