doutes: "Environ 2,2 points des 12,67 % d'instructions en moins ne viennent pas de l'Adler-32 mais d'un autre ordonnancement par gcc 13.3 du reste de tinfl_decompress : ils peuvent disparaître ou s'inverser avec un autre compilateur, une autre version de gcc ou ARM64 ; le gain propre à la zone est de -10,5 % du total, et je ne sais pas quelle part du +7 % de débit vient de cet effet de bord. La performance suppose que le compilateur déroule les 10 itérations ; sinon il paie environ deux instructions de plus par 16 octets (prototype : 1,52 contre 1,33 par octet), sans effet sur la justesse. Les sorties de moins de 160 octets par appel (flux à petits tampons) et le reste de chaque bloc gardent la boucle de miniz-0016 : aucun gain là. Les bornes ne valent que pour 20 tours par groupe : changer 160 sans refaire le calcul ferait déborder une voie. Le code déroulé ajoute quelques centaines d'octets dans tinfl_decompress. Chronomètre mesuré sur une seule machine virtualisée et partagée : ab.py voit le gain au-delà du bruit (10 paires sur 10, deux fois), mais le juge commun en local ne le confirme pas (6 sur 10, débit très dispersé) ; c'est son verdict en CI qui dira si R4 tient au chronomètre."
