doutes: >
  Behaviour change for a local simulation only: one that relied on verdict.py finding an ab.json somewhere under
  --artefacts must now pass --ab (or put juge.json in --juge), and its state files go at the root of --etats or in
  the jobs' state folders (no longer anywhere under --artefacts). The state folders are those bee-ci.yml uploads
  today: a job that changes where it puts its states must change DOSSIERS_ETATS with it, or its step stays without a
  result and the verdict red, never green. The fork's CI judges a PR with the base's bee/, so this
  PR's own manifest check and verdict use master's scripts; the new ones apply from the next PR on (the job « Tests de
  l'outillage de CI de la PR » runs this PR's test_verdict.py).
