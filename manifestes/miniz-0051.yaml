resume: "minizBee's CI: a manifest is a regular file before it is read or copied; each file the verdict reads, state files included, comes only from the job that produces it, never through a link."
changement: >
  Hardening of minizBee's CI on libyamlBee's approach (libyaml-0020, libyamlBee PR 3). A manifest is a regular file:
  bee/ci/manifeste.sh checks that the manifest the PR names is neither a symbolic link (dangling included) nor a
  folder before anything reads it, and otherwise fails without reading the task, calling the registry's tool or
  writing any output; bee/ci/tache.py makes the same check on its own (lstat) before opening the manifest, and its
  refusal prints the strictest compressed-output control, like any other refusal; the workflow's step « Conserver le
  manifeste, la tâche et l'état » copies the manifest into the etat-manifeste artifact only if it is a regular file.
  Each file is read only from the job that produces it: bee/ci/verdict.py reads tache.yaml, CONTRIBUTION.yaml and
  juge-ancien.json only at the root of the artifact of their job (etat-manifeste, etat-juge-ancien), never from
  another artifact or a subfolder; the report comes from --ab or from juge.json at the root of the « juge » artifact,
  in CI and in a local simulation alike (the simulation no longer looks for an ab.json in the downloaded artifacts).
  Each state file <step>.txt is read only in the state folder of the job that writes it, as bee-ci.yml uploads it
  (DOSSIERS_ETATS: etat-manifeste/etats, etat-tests-<arch>, etat-fuzzing, etat-greffon, etat-juge-ancien/etats;
  « juges » and « amorcage », written by every job, in each of these folders), and at the root of --etats (the
  verdict job's own folder, or a simulation's); never in « juge », another artifact or a subfolder, so a missing state
  stays without a result. A file found in the artifacts (task copy, manifest, reports, states, the judge's code outside
  CI) is read only if it is a regular file, never through a symbolic link. These two follow the independent
  adversarial review. bee/README.md: two rows of the CI table say so. Size: 6 lines counted by R1 (bee-ci.yml, +4 -2);
  outside the tests, bee/ci/manifeste.sh +6 -1, bee/ci/tache.py +7 -2, bee/ci/verdict.py +53 -31, bee/README.md +2 -2
  (bee/** is excluded from R1); bee/ci/test_verdict.py +205 -14 (the tests' state files now written where their jobs
  put them).
