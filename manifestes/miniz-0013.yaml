resume: "tdefl_compress_normal : insertion dans le dictionnaire et les chaînes de hachage sans masque ni test du miroir par octet dans le cas courant, boucle déroulée par deux."
changement: >
  miniz_tdef.c, première partie de tdefl_compress_normal (mise à jour de m_dict, m_next et m_hash
  pour chaque octet entrant), 45 lignes ajoutées et 12 retirées, rien d'autre. Avant, chaque octet
  masquait dst_pos et ins_pos, testait la copie miroir (dst_pos < 257) et passait par des indices
  32 bits : environ 21 instructions par octet avec GCC 13 -O3. Maintenant, quand le morceau à
  insérer ne revient pas au début de la fenêtre et ne touche pas la copie miroir
  (dst_pos >= TDEFL_MAX_MATCH_LEN - 1 et dst_pos + num_bytes_to_process <= TDEFL_LZ_DICT_SIZE,
  donc ins_pos & TDEFL_LZ_DICT_SIZE_MASK == dst_pos - 2), une boucle sur des pointeurs fixes
  pDst = m_dict + dst_pos et pNext = m_next + dst_pos - 2, sans masque ni test, déroulée par deux
  (l'octet impair éventuel d'abord), fait les mêmes écritures dans le même ordre : m_dict[dst],
  puis hachage glissant, m_next[ins] = m_hash[h], m_hash[h] = ins, octet après octet ; environ
  11,5 instructions par octet (23 par paire). Les autres cas (environ 1,4 % des octets dans le
  profil n1 : tour de fenêtre, 257 premières positions) gardent la boucle d'origine, inchangée. Le hachage est le même (même
  formule, même masque, variable en size_t pour éviter une extension par octet) ; ni le format, ni
  l'API, ni la taille des tables ne changent ; tdefl_find_match n'est pas touchée (aucun conflit
  avec miniz-0014, qui ne modifie que tdefl_find_match). Pistes essayées et écartées, mesurées en
  instructions n1 (cachegrind, 128 Kio par fichier, programme entier, base 190 667 732) : garder
  le hachage glissant d'une itération à l'autre au lieu de le recalculer depuis deux octets du
  dictionnaire, -7,8 % en n1 mais une variable de plus vivante pendant tout le corps de boucle,
  donc un registre de moins dans tdefl_find_match incorporée (lookahead_pos relu sur la pile
  dans la troisième sonde) et un n9 chronométré plus lent (B gagne 1 paire sur 10) : abandonnée
  au profit de la version retenue, qui fait moins d'instructions partout (n1 -8,3 %, n6 -4,4 %,
  n9 -3,1 %) ; second hachage de chaque paire calculé directement depuis le premier état
  (chaîne de dépendance raccourcie) : +2,4 % d'instructions et pas de gain chronométré,
  abandonnée ; boucle non déroulée : -6,2 % seulement.
