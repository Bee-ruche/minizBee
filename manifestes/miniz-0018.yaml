resume: "tinfl_decompress, boucle des littéraux : borne de sortie calculée une fois par appel, tests code_len == 0 sortis du chemin chaud ; mêmes statuts, même état, mêmes octets."
changement: >
  Deux changements dans la boucle rapide des littéraux de tinfl_decompress (miniz_tinfl.c), rien d'autre.
  (1) Le test de sortie (pOut_buf_end - pOut_buf_cur) < 2 devient pOut_buf_cur >= pOut_buf_fast_end, avec
  pOut_buf_fast_end = pOut_buf_next + (*pOut_buf_size - 1) si le tampon fait au moins 2 octets, pOut_buf_next
  s'il en fait 0 ou 1, et NULL si pOut_buf_next est nul. Elle est calculée avant TINFL_CR_BEGIN, donc valable à
  chaque ré-entrée de la coroutine. Équivalence exacte : pOut_buf_cur reste dans [pOut_buf_next, pOut_buf_end], et
  pour une taille >= 2, cur < end - 1 <=> end - cur >= 2 ; pour une taille 0 ou 1, ni l'ancien ni le nouveau test ne
  prend le chemin rapide ; sortie nulle : NULL >= NULL, chemin lent comme avant. Le choix chemin rapide / chemin lent
  est donc le même à chaque tour.
  Le test d'entrée (pIn_buf_end - pIn_buf_cur) < 4 est laissé tel quel : sa version précalculée a été
  essayée (trois écritures) et donne plus d'instructions (gcc la recalcule à chaque entrée de boucle, ou déplace des
  variables sur la pile) : -2,2 % à -3,4 % au lieu de -3,76 %.
  (2) Les deux tests code_len == 0 (états 40 et 54) passent dans la branche rare. Les seules écritures de m_look_up
  sont 0 (remise à zéro), (code_size << 9) | sym avec 1 <= code_size <= 10 (donc >= 512) et un indice d'arbre
  négatif ; la descente d'arbre donne code_len >= 11. Donc code_len == 0 <=> entrée de table nulle. La lecture de la
  table teste maintenant sym2 > 0 au lieu de sym2 >= 0 (même coût) et, dans la branche « sinon », une entrée nulle
  échoue aussitôt avec le même état (40 ou 54), le même counter (0 pour l'état 40, inchangé pour 54), bit_buf et
  num_bits inchangés (l'ancien code les décalait de 0) et aucun octet écrit, exactement comme avant. Le chemin lent
  (TINFL_HUFF_DECODE) n'est pas touché. Effet : 2
  instructions de moins par symbole décodé dans le chemin rapide, 3 par tour pour le test de sortie (registre au lieu
  de mov/sub/cmp). Le code de compression compilé est identique octet pour octet (sections .text de miniz.o et
  miniz_tdef.o comparées) ; tinfl_decompress passe de 9429 à 9621 octets de code. La piste « pointeurs locaux vers
  les tables » (note du 27/10) n'a pas été reprise.
