  and a missing one is an environment error (code 2). A test in bee/ci/test_verdict.py ties the declared history to
  the plugin's COMMIT_CORPUS (the old and the new commit may both be declared during a PR that changes it).
  bee/README.md, bee/juge/projet.py and bee/ci/verdict.py no longer describe juge-v1 or the fetch.
