resume: "minizBee moves to the common judge juge-v2: juge.yml pinned at dab13a6, corpus commit declared as history, no git fetch while judging."
changement: >
  bee-ci.yml calls Bee-ruche/registre/.github/workflows/juge.yml@dab13a6e769a19937def567ed896a05b534c61dc (juge-v2,
  ruche-0024: the judge read at the workflow's own commit, refused unless on the registry's main) and extracts
