resume: "tinfl_decompress : si bit_buf a 20 bits après un symbole de longueur, longueur et distance décodées sans les macros ni lecture d'entrée ; -5,5 % d'instructions en décompression."
changement: >
  miniz_tinfl.c, tinfl_decompress seulement, sous #if TINFL_USE_64BIT_BITBUF (le tampon de bits de 32
  bits garde le code d'origine) : (1) un tableau statique s_fast_tables[6][32] qui reprend
  s_dist_base, s_dist_extra, s_length_base, s_length_extra et les masques (1 << extra) - 1 dans un seul
  objet, pour qu'une seule adresse les serve tous (une seule instruction lea en code PIE au lieu de
  quatre, plus de calcul de masque) ; ses valeurs ont été comparées par programme aux tables d'origine ;
  (2) après un symbole de longueur, un chemin rapide pris quand num_bits >= 20. Les bits
  supplémentaires de la longueur (5 au plus) et le code de distance (15 bits au plus) sont alors déjà
  dans bit_buf : ils sont décodés sans les tests des macros et sans lire d'entrée. Code de distance
  par la table m_look_up[1] (entrées (longueur du code << 9) | symbole) ou, au-delà de 10 bits, par le
  même parcours d'arbre que TINFL_HUFF_DECODE, dont le résultat est remis sous forme d'entrée de table.
  Si num_bits >= bits supplémentaires de la distance, ils sont lus aussi ; sinon le code saute
  (goto tinfl_dist_extra_bits, étiquette ajoutée juste avant le if (num_extra) d'origine) dans le
  TINFL_GET_BITS(27) inchangé, avec num_extra et dist comme la base les aurait : même état 27, mêmes
  lectures, même suspension éventuelle. Le chemin générique (num_bits < 20) est le code d'origine, mis
  dans un bloc else et réindenté (git diff -w le montre inchangé hors l'étiquette). Pourquoi la sortie,
  les statuts et les octets consommés sont identiques : quand num_bits >= 20, la base non plus ne lit
  rien dans TINFL_GET_BITS(25) (num_bits >= 5) ni dans TINFL_HUFF_DECODE(26) (num_bits >= 15 après les
  bits de longueur, donc ni remplissage de 2 octets ni TINFL_HUFF_BITBUF_FILL) ; les deux codes
  consomment les mêmes bits dans le même ordre et donnent le même counter et le même dist, y compris
  pour une entrée de table vide (longueur de code 0, symbole 0, comme la branche rapide de la macro),
  les symboles invalides 30 et 31 (base 0, 0 bit) et 286, 287 (longueur 0). Seule différence d'état
  interne : num_extra, mort à cet endroit, n'est écrit que juste avant le saut ; r->m_num_extra peut
  donc différer de la base à un retour ultérieur, sans effet, car il n'est lu qu'à la reprise des états
  18, 25 et 27, qui l'écrivent eux-mêmes. L'écrire coûterait 264 000 instructions (-4,6 % au lieu de
  -5,5 %). Pourquoi pas la piste de la tâche (recharger bit_buf de 32 bits sur le chemin rapide) :
  essayée d'abord ; recharger quand num_bits < 33 donnait jusqu'à -4,5 % d'instructions, mais ce test
  part dans les deux sens selon les données (num_bits < 33 dans 30,5 % des cas à cet endroit, mesuré
  sur le scénario de décompression) : +31 000 prédictions de branchement manquées en simulation
  (cachegrind --branch-sim) et aucun gain au chronomètre. num_bits >= 20 est vrai dans 98,5 % des cas :
  le test est presque toujours pris et le nouveau chemin a autant de prédictions manquées simulées que
  la base (315 792 contre 314 368). Effet mesuré : -5,48 % d'instructions sur instructions_decompression
  (29 954 575 -> 28 312 841), compression inchangée à l'instruction près ; au chronomètre, gain petit
  mais au-delà du bruit, +0,7 à +0,9 % (séries décompression seule décrites dans teste) ; ab.py ne
  conclut pas sur cette machine chargée (voir teste et doutes). Diff : 78 lignes ajoutées, 14 retirées.
