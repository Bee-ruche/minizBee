  - "script de rejeu de la seconde revue adverse (scenarios/rejouer.py) sur le workflow et le verdict.py corrigés : copie par squash et par cherry-pick refusées (refus_rebase), criss-cross refusé (refus_point_de_depart), les trois verdicts incohérents rouges"
  - "verdict.py simulé sur les rapports réels de la comparaison (juge commun et ancien juge) : ci verte, juge.commun juge-v1, juge.version 3, details.juge_ancien rempli"
