changement: >
  bee/juge/ ne garde que ce qui est propre à miniz : projet.py (le greffon, repris de la branche essai/juge-commun),
  construire.sh (harnais compilé avec les en-têtes de la base, /outillage/base ; un objet par .c dans obj/ ; ni chrono
  ni relevés, faits par le juge commun), execution.c (inchangé, octet pour octet) et test_juge.py. Dockerfile, chrono.c,
  analyse.py, juge.py et isoler.sh quittent le fork : la CI les prend dans le registre à l'étiquette juge-v1. Le
  greffon va chercher le commit 2948eeb (git fetch --depth=1 sur l'hôte) quand la base est extraite sans historique,
  ce que fait juge.yml (fetch-depth 1) : sans cela, bee/corpus/generer.py ne trouverait pas miniz_tdef.c et
  miniz_tinfl.c d'origine et le juge commun s'arrêterait (code 2). CI (bee-ci.yml) : le job juge appelle
  Bee-ruche/registre/.github/workflows/juge.yml@juge-v1 avec l'option sortie_compressee de la tâche ; un job greffon
  choisit le commit dont le juge commun lit le greffon et A, le point de départ de la PR si son bee/ est celui de la
  base, sinon la base, jamais la PR ; compilation, tests et fuzzing tournent dans le conteneur du juge commun
  (isoler.sh du registre, image commune avec les PAQUETS du greffon) ; méta-tests du greffon si la PR modifie bee/juge/
  ou bee-ci.yml ; verdict.py tire l'étape juge_isole du code du juge commun (sortie du job juge, jamais un fichier
  d'état), lit l'artefact « juge » et reporte juge.version, juge.commun, juge.projet et juge.greffon. Amorçage : la base
  de CETTE PR a encore l'ancien juge et pas de greffon ; bee/ci/juges.sh (et sa copie dans le workflow) a une règle
  « introduction du greffon » qui garde les juges de la base, fait juger la PR par l'ancien juge de la base (job
  juge-ancien, transition) ET par le juge commun avec le greffon de la PR (à condition qu'elle ne touche pas miniz),
  et prend l'assembleur du verdict de la PR (amorcage: true). L'ancienne règle « introduction du juge isolé » est
  retirée : après cette PR, une PR qui apporterait un bee/juge/juge.py ne se jugerait plus elle-même. Retirés aussi :
  le CONTRIBUTION.yaml de miniz-0016 laissé à la racine de master, et le garde « if [ -f base/bee/bench/test_profil.py ] ».
  bee/README.md : modèle de menace mis à jour (registre / fork, où le greffon est lu, nouvelles attaques couvertes).
  Comparaison à graine égale (graine 00320000b5e0c0de0032b5e0c0de2026, --repetitions 2 --chauffe 1, A = master
  9977da4, Docker local) : contre B = master et contre B = la PR honnête miniz-0017, juge v2 et juge commun comparent
  chacun 2 988 sorties, sans construction suspecte, et comptent les mêmes instructions de A et de B dans les quatre
  scénarios (n1 171 444 706 / 171 444 706 ; n6 335 520 529 / 335 520 529 ; n9 483 768 304 / 483 768 304 ; décompression
  30 481 065 / 29 184 416 avec miniz-0017, 30 481 065 / 30 481 065 avec master) ; ratio_n6 identique (3,505421).
