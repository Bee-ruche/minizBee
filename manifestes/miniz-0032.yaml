  - "ARM64 et libFuzzer : seulement en CI"
  - "le scénario de la revue adverse sur GitHub Actions lui-même (job greffon rouge) : seulement sur de petits dépôts git, avec le script du job extrait du workflow"
doutes: >
  1) Le greffon fait un git fetch sur l'hôte quand la base est extraite sans historique : dépendance au réseau de GitHub
  pendant le jugement ; la vraie correction est dans juge.yml du registre (extraction complète de la base), tâche
  d'outillage du registre. 2) Pendant l'introduction (cette PR seulement), le greffon de la PR est du Python exécuté sur
  l'hôte (image, jugement) et l'assembleur du verdict est celui de la PR : c'est l'amorçage, relu par un gardien. 3) Le
  harnais (inchangé) dimensionne ses tampons de compression avec mz_compressBound et mz_deflateBound, du code jugé ;
  il passe leur taille à miniz et borne ses copies, mais la règle du juge commun (« borne connue du format, au
  minimum ») n'y est pas appliquée telle quelle : la changer changerait les décomptes d'instructions. 4) Le job
  juge-ancien reste dans le workflow après la fusion, sans effet ; à retirer dans une tâche suivante. 5) Le prix de la
  règle du point de départ : une PR doit être rebasée sur master après chaque fusion qui touche miniz ou bee/, sinon
  sa CI est rouge ; après cette fusion, les PR #13 (miniz-0018) et #15 (miniz-0017) devront être rebasées. 6) juge.yml, même épinglé par SHA, extrait lui-même le code
  du juge commun à l'étiquette juge-v1 (son JUGE_COMMUN_REF), qui peut se déplacer et qu'une branche du même nom
  masquerait : à épingler par SHA dans le registre, avec des étiquettes juge-v* protégées. 7) verdicts.yml du registre
  prend la dernière exécution de bee-ci.yml pour un SHA sans vérifier la PR ni la base (revue adverse, S1) :
  base_juge et details.base sont maintenant dans verdict.json, mais c'est au registre de les vérifier. 8) Non traités
  ici, à suivre dans une tâche : les annotations « :: » qu'une sortie de binaire pourrait injecter dans le journal
  (M-4) et le SHA d'un fork du registre (M-5).
