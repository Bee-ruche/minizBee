resume: "tdefl_find_match : probe_pos et next_probe_pos en size_t au lieu de mz_uint ; gcc n'ajoute plus de copie ni de second masque par sonde (13 -> 11 instructions par sonde, n9 -9,1 % d'instructions)."
changement: >
  miniz_tdef.c, version par défaut de tdefl_find_match (celle sans MINIZ_USE_UNALIGNED_LOADS_AND_STORES) :
  5 lignes ajoutées (dont 4 de commentaire), 1 retirée. Seule la largeur de deux variables change :
  probe_pos et next_probe_pos passent de mz_uint à size_t. Rien d'autre : mêmes sondes, même
  décompte de num_probes_left, mêmes correspondances, m_next nul toujours fin de chaîne.
  Désassemblage de la boucle des sondes (gcc 13.3 -O3 -DNDEBUG, tdefl_find_match incorporée dans
  tdefl_compress_normal, 2e et 3e sondes du déroulage). Avant, 13 instructions par sonde :
  movzwl m_next(%r15,%r9,2),%eax ; test %ax,%ax ; je ; mov lookahead_pos,%r8d ; sub %eax,%r8d ;
  movzwl %r8w,%r8d ; cmp %r8d,%r13d ; jb ; mov %eax,%r9d ; and $0x7fff,%eax ; and $0x7fff,%r9d ;
  cmp %r14w,(%r12,%rax,1) ; je. Après, 11 : les mêmes sans « mov %eax,%r9d » ni le second and
  (l'unique registre masqué sert d'indice à m_next et à m_dict). La première sonde du déroulage relit
  encore lookahead_pos sur la pile, avant comme après. Le reste de la fonction est inchangé. Cela
  fait 1,94 instruction de moins par sonde en moyenne sur n9 (44 135 322 instructions de moins pour
  les 22,7 millions de sondes que compte le contexte de la tâche).
  Correction : dist = (mz_uint16)(lookahead_pos - next_probe_pos) se calcule désormais en 64 bits
  puis se tronque à 16 bits ; les 16 bits de poids faible d'une différence ne dépendent que de ceux
  des opérandes, donc la valeur est celle d'avant. next_probe_pos vient d'un mz_uint16 : jamais
  au-dessus de 65 535 ; probe_pos = next_probe_pos & TDEFL_LZ_DICT_SIZE_MASK reste dans m_next et
  dans m_dict. Sur une cible 32 bits, size_t a la largeur de mz_uint : aucun changement.
  Pistes mesurées et écartées (instructions n9, base 482 752 478 ; temps processeur du banc, 20
  alternations). (1) size_t, distance en 16 bits (lp16, md16) et boucle sans test du zéro quand
  lp16 > max_dist (un maillon nul y est déjà refusé par la distance) : -17,5 % d'instructions n9
  mais temps -0,9 à -1,7 % (plus lent que la base) sur deux passages, pire que size_t seul ; (2) size_t et boucle sans test
  du zéro, distance en 32 bits : -12,9 % d'instructions, temps +1,2 à +2,0 %, sans mieux que size_t
  seul, pour quinze lignes de plus ; (3) lea à la place de mov + sub dans la distance, sur la variante (1) :
  plus d'instructions (n9 +0,8 %) et n1 +1 %. Constat : la boucle est dominée par la latence de la chaîne
  m_next (environ 15 cycles par sonde pour 11 instructions, 0,64 défaut L1 par sonde selon le
  contexte de la tâche), donc le temps suit moins que les instructions. Un essai de prélecture
  (__builtin_prefetch de la première sonde du tour suivant, d'après m_next[pos + 1]) ajoutait
  environ +2 % de temps à n9 sur cette machine : c'est une autre idée (R1), non incluse ici ; elle
  pourrait faire l'objet d'une tâche.
