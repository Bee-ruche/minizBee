resume: "tdefl_find_match : indices de chaîne en size_t (13 -> 11 instructions par sonde, n9 -8,5 % d'instructions) et prélecture du premier maillon du tour suivant ; la CI avait vu un recul de 1,2 % à n9 avec le seul size_t."
changement: >
  miniz_tdef.c, version par défaut de tdefl_find_match (celle sans MINIZ_USE_UNALIGNED_LOADS_AND_STORES) :
  deux commits, 12 lignes ajoutées (dont 7 de commentaire), 1 retirée. Mêmes sondes, même décompte de
  num_probes_left, mêmes correspondances, m_next nul toujours fin de chaîne.
  (1) Commit 0998730 : probe_pos et next_probe_pos passent de mz_uint à size_t, rien d'autre. Désassemblage de
  la boucle des sondes (gcc 13.3 -O3 -DNDEBUG, tdefl_find_match incorporée dans tdefl_compress_normal, 2e et
  3e sondes du déroulage). Avant, 13 instructions par sonde : movzwl m_next(%r15,%r9,2),%eax ; test %ax,%ax ;
  je ; mov lookahead_pos,%r8d ; sub %eax,%r8d ; movzwl %r8w,%r8d ; cmp %r8d,%r13d ; jb ; mov %eax,%r9d ;
  and $0x7fff,%eax ; and $0x7fff,%r9d ; cmp %r14w,(%r12,%rax,1) ; je. Après, 11 : les mêmes sans
  « mov %eax,%r9d » ni le second and (l'unique registre masqué sert d'indice à m_next et à m_dict). Cela fait
  1,94 instruction de moins par sonde en moyenne à n9 (44 135 322 instructions de moins pour les 22,7
  millions de sondes que compte le contexte de la tâche). dist = (mz_uint16)(lookahead_pos -
  next_probe_pos) se calcule alors en 64 bits puis se tronque à 16 bits : les 16 bits de poids faible
  d'une différence ne dépendent que de ceux des opérandes, donc la valeur est celle d'avant.
  next_probe_pos vient d'un mz_uint16, probe_pos reste dans m_next et m_dict. Sur une cible 32 bits, size_t
  a la largeur de mz_uint : code inchangé.
  Verdict de la CI du fork sur ce seul commit (juge commun, PR 20, 10 répétitions) : instructions n9
  -9,13 %, n6 -6,94 %, n1 -0,41 %, mais chronomètre n9 -1,23 % (B gagne 1 paire sur 10 : « dégradation
  au-delà du bruit »), n6 -0,37 %, n1 +0,12 %, décompression +0,54 % (9/10, code de tinfl identique).
  Donc R4 refusée pour ce commit : moins d'instructions, pas plus vite. Cause probable : la boucle est
  dominée par la latence de la chaîne m_next (environ 15 cycles par sonde pour 11 instructions, 0,64 défaut
  L1 par sonde selon le contexte de la tâche), que les instructions en moins ne raccourcissent pas.
  (2) Commit 8a83565 : essai de la parade, une prélecture. Pour les recherches de plus de 8 sondes
  (niveaux 6 à 10), __builtin_prefetch de m_next[m_next[(pos + 1) & masque] & masque] au début de l'appel :
  le premier maillon de la chaîne de la position suivante (m_next[pos + 1] est déjà en cache) arrive pendant
  le travail de l'appel courant. Sans effet sur les sondes ni sur la sortie ; protégé par
  __GNUC__ / __clang__ (rien ailleurs). C'est une seconde idée, ajoutée dans la même PR parce que la
  première seule échoue à R4 ; si les relecteurs la jugent hors périmètre (R1), le commit 0998730 est la
  contribution d'instructions, le commit 8a83565 se retire sans toucher au premier.
  Pistes mesurées et écartées (instructions n9, base 482 752 478 ; temps processeur du banc sur ma
  machine, 20 alternations). (a) size_t, distance en 16 bits (lp16, md16) et boucle sans test du zéro quand
  lp16 > max_dist (un maillon nul y est déjà refusé par la distance) : -17,5 % d'instructions mais temps -0,9
  à -1,7 % (plus lent que la base) sur deux passages ; (b) size_t et boucle sans test du zéro, distance en 32
  bits : -12,9 % d'instructions, temps +1,2 à +2,0 %, pas mieux que size_t seul, pour quinze lignes de plus ;
  (c) lea à la place de mov + sub dans la distance, sur (a) : plus d'instructions (n9 +0,8 %, n1 +1 %) ;
  (d) la prélecture seule, sur la base sans size_t : temps +0,0 % ; (e) prélecture de m_dict en plus de
  m_next : +2,8 % contre +3,3 % pour m_next seul. Sur ma machine (Xeon @ 2,1 GHz), size_t seul donne +2,6 à
  +3,4 % de temps processeur à n9 alors que la CI voit -1,2 % : mes mesures locales ne prédisent pas celles de
  la CI, à ne pas prendre pour acquises.
