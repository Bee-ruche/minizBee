resume: "tdefl_find_match (variante octet par octet) : chaque sonde compare les deux octets de fin de correspondance en une lecture 16 bits par memcpy, depuis un pointeur précalculé."
changement: >
  miniz_tdef.c, variante octet par octet de tdefl_find_match (celle compilée par défaut, puisque
  MINIZ_USE_UNALIGNED_LOADS_AND_STORES vaut 0 partout) : 11 lignes ajoutées, 5 retirées, dont 4 de
  commentaire. Avant, chaque TDEFL_PROBE comparait m_dict[probe_pos + match_len] à c0 puis
  m_dict[probe_pos + match_len - 1] à c1 : GCC 13 -O3 calculait probe_pos + match_len en 32 bits à
  chaque sonde (lea + mov, non repliable dans l'adressage), relisait c1 sur la pile et faisait un
  second test sur le chemin « c0 égal ». Maintenant un pointeur pTail = m_dict + match_len - 1 est
  calculé une fois (et recalculé quand match_len grandit), et chaque sonde lit les deux octets
  pTail[probe_pos] et pTail[probe_pos + 1] en un mot de 16 bits par memcpy, comparé à c01 lu de
  la même façon à la position courante. Correction : ce sont exactement les octets que lisait
  l'ancienne version (c0 et c1 en tête, puis les deux mêmes octets à chaque sonde ; l'ancienne
  lisait déjà toujours probe_pos + match_len, et probe_pos + match_len - 1 >= probe_pos car
  match_len >= 2 à l'entrée, TDEFL_MIN_MATCH_LEN - 1 ou m_saved_match_len), donc pas de nouvelle
  lecture hors de m_dict (indice maximal 32767 + 257 = 33024 < 33025). L'égalité de deux mots lus
  de la même façon équivaut à l'égalité des deux octets, quel que soit le boutisme ; aucune lecture
  non alignée par transtypage, aucun alias strict violé. Mêmes correspondances choisies : sortie
  compressée identique (305 empreintes, et 15 900 sorties comparées octet pour octet à la base, voir
  teste). Le nombre de sondes, le hachage, les chaînes et la variante 16 bits
  (MINIZ_USE_UNALIGNED_LOADS_AND_STORES=1, qui compare déjà c01 sur 16 bits) ne sont pas touchés ; miniz-0010 n'est pas
  intégrée, rien à reporter sur elle. Pistes essayées et écartées, mesurées une par une
  (instructions n9, base 510 229 776) : pointeur précalculé seul avec les deux comparaisons
  d'octets, +4,8 % puis -0,1 % selon l'écriture (GCC duplique probe_pos dans deux registres) ;
  pointeur local vers m_next, -2,0 % seulement (moins bien que la version retenue, -2,67 %) ;
  probe_pos ou next_probe_pos en size_t, test de distance réordonné, dist recalculé après la
  boucle, lookahead_pos tronqué une fois : code identique ou plus lent. La sonde ratée coûte
  toujours 13 instructions (GCC garde une copie inutile de probe_pos) ; le gain vient du chemin
  « c0 égal, c1 différent », d'une branche en moins et de c1 qui n'est plus relu sur la pile.
