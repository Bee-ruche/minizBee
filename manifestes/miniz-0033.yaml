doutes: |
  Le repérage reste textuel : sans_commentaires() ne fait pas de prétraitement (macros, #if 0, trigraphes,
  séparateurs de chiffres C23 1'000) ; une apostrophe isolée sur une ligne n'est pas prise pour un caractère
  littéral (il ne franchit pas une fin de ligne), mais un code C exotique pourrait encore tromper l'outil.
  Limite préexistante, laissée telle quelle puisque les plages doivent rester inchangées : DEBUT_FONCTION
  n'accepte que des noms en minuscules, donc mz_deflateInit, mz_deflateInit2, mz_deflateReset,
  mz_deflateEnd, mz_deflateBound, mz_compressBound, mz_inflateInit, mz_inflateInit2, mz_inflateReset,
  mz_inflateEnd (miniz.c) et TDEFL_READ_UNALIGNED_WORD* (miniz_tdef.c, sous #if) ne sont pas repérées ;
  leur coût part en « miniz.c (hors fonction) » (≈ 4 500 Ir par scénario de compression, négligeable).
  Piste pour une tâche suivante.
  Remarques hors périmètre : avec bee/sandbox/sans-docker.sh, le dépôt est monté à un chemin temporaire
  différent à chaque session ; si le banc est compilé dans une session et profilé dans une autre,
  callgrind_annotate ne retrouve pas les sources et tout part en « hors miniz » : il faut compiler et
  profiler dans la même session (make -B -C bee banc && python3 bee/bench/profil.py). Le tableau de
  profil de bee/README.md date d'avant miniz-0011/0015 (lignes et parts périmées) ; non modifié ici.
