changement: >
  Construction des tables de Huffman de tinfl_decompress (miniz_tinfl.c, boucle « for (; (int)r->m_type >= 0; ...) »),
  rien d'autre ; 25 lignes ajoutées, 15 retirées. Avant : chaque code de 10 bits au plus écrivait ses 2^(10-L) copies
  dans m_look_up (environ 1024 écritures par table, 6 instructions chacune avec gcc 13.3, qui relit pLookUp sur la pile
  à chaque tour), après un renversement bit à bit de son code (environ 4 instructions par bit). Profil callgrind du
  scénario des instructions : 824 K instructions pour le remplissage, 286 K pour le renversement, 1,40 M en tout
  (4,09 %). Maintenant, après la remise à zéro, l'arbre vidé, le décompte et le contrôle de validité, laissés tels
  quels : (1) tri par dénombrement des symboles selon leur longueur, à partir de total_syms déjà calculé (longueurs 1 à
  10 dans un compartiment chacune, codes de plus de 10 bits dans un dernier compartiment, dans l'ordre des symboles) ;
  (2) pour i = 1 à 10, chaque code de longueur i est écrit une seule fois, à son code renversé rev (< 2^i), puis les
  2^i premières entrées sont recopiées sur les 2^i suivantes (doublement de table, technique de build_decode_table de
  libdeflate, licence MIT ; idée reprise, aucun code copié). rev est tenu sous forme renversée par un incrément
  renversé (le +1 du code canonique bascule les 1 de poids faible à partir du bit i-1) ; passer à la longueur i+1
  double le code canonique (next_code[i+1] = (next_code[i] + total_syms[i]) << 1), ce qui laisse rev inchangé : on
  obtient exactement les codes de next_code[], symbole par symbole. (3) Les codes longs passent ensuite par la boucle
  d'origine, dans l'ordre des symboles : même allocation de tree_next, même arbre. Pourquoi la table finale est
  identique : après la longueur i, l'entrée x < 2^i contient le code de longueur <= i dont le code renversé vaut x
  modulo 2^longueur, ou 0 ; c'est exactement ce que l'ancien remplissage met dans [0, 2^i). Un code qui passe le
  contrôle (complet, ou au plus un symbole) est sans préfixe : un code court n'écrit jamais l'entrée-préfixe d'un code
  long, qui reste à 0 (memset conservé) jusqu'à la passe des codes longs, comme avant, où les deux remplissages
  touchaient des entrées disjointes. Le code ajouté ne contient aucun TINFL_CR_RETURN ; l'échec à l'état 35 arrive
  avant lui, avec le même état (table remise à zéro, arbre vidé). Coût : 672 octets de pile de plus (syms[288] en
  mz_uint16, pos[12]) : 448 -> 1120 octets pour tinfl_decompress avec gcc 13.3 -O3 (-fstack-usage), et 800 octets
  de code. Variantes essayées puis écartées : sauter les doublements tant que la table est vide (+3,8 K
  instructions, aucun gain au chronomètre) ; tri sans branche, symboles de longueur 0 dans un compartiment final (+36 K
  instructions, +0,08 % au chronomètre sur le scénario 1 Kio). Fusion vérifiée avec git merge-tree : propre avec
  tache/miniz-0018 (boucle des littéraux) et tache/miniz-0016 (Adler-32). Gains cumulables : miniz-0018 seule
  32 880 282 instructions, fusionnée avec cette tâche 31 934 498 (-2,88 % de plus).
