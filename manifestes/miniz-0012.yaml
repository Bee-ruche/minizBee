doutes: "Le gain dépend de la microarchitecture : sur ce Xeon, il vient surtout des correspondances de 4 à 8 octets copiées sans boucle, mais un processeur qui prédit mieux la boucle octet par octet, ou qui traite autrement les chargements de 8 octets non alignés, peut gagner moins. Une correspondance sans chevauchement peut encore lire des octets écrits juste avant (littéraux ou correspondance précédente), ce qui peut coûter une attente du tampon d'écriture ; sur le corpus et sur les données synthétiques essayées, ce n'est pas visible, mais d'autres formes de données n'ont pas été mesurées. Les chiffres du chronomètre viennent d'une machine partagée ; les instructions, elles, sont exactes."
