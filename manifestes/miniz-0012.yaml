resume: "tinfl_decompress : correspondances sans chevauchement copiées par deux mouvements de 4 octets (longueur 4 à 8) ou par blocs de 8 octets (9 et plus), sans écrire au-delà de la correspondance."
changement: >
  miniz_tinfl.c, tinfl_decompress, copie des correspondances seulement : 33 lignes ajoutées, aucune
  retirée, juste avant la boucle octet par octet, après le test de fin de tampon (inchangé) et après
  le bloc MINIZ_USE_UNALIGNED_LOADS_AND_STORES existant (laissé tel quel). Aucune autre région du
  fichier n'est touchée : ni la boucle des littéraux et les tests code_len (miniz-0018), ni la fin de
  la fonction (miniz-0016) ; git merge-tree fusionne la branche sans conflit avec chacune des deux.
  Nouveau chemin, pris quand la correspondance tient entière dans le tampon (condition d'origine),
  fait au moins 4 octets et ne chevauche pas sa source : pOut_buf_cur - pSrc >= counter (différence
  de deux pointeurs du même tampon, négative si la source est après la destination, cas laissé à la
  boucle octet par octet). Longueur 4 à 8 : deux mouvements de 4 octets, l'un au début, l'autre
  finissant pile à la fin (ils se recouvrent si la longueur est inférieure à 8). Longueur 9 et plus :
  blocs de 8 octets, puis un dernier bloc de 8 octets qui finit pile à la fin de la correspondance.
  Tous les mouvements passent par memcpy vers ou depuis une variable locale (mz_uint32, mz_uint64),
  sans transtypage de pointeur ; rien n'est écrit au-delà de la fin de la correspondance (le reste du
  tampon de l'appelant et le dictionnaire circulaire ne sont pas touchés). Pourquoi la sortie est
  identique : source et destination sont disjointes, donc chaque octet lu est un octet antérieur à la
  correspondance, que la copie ne modifie pas ; la copie octet par octet ferait exactement les mêmes
  écritures, et le dernier bloc réécrit les mêmes valeurs là où il recouvre le précédent. En sortie,
  counter vaut counter % 3, la valeur que laisse la boucle octet par octet (elle est sauvée dans
  r->m_counter si le décodage suivant se suspend) : l'état du décompresseur est identique, octet pour
  octet (vérifié, voir teste). La copie octet par octet reste le chemin générique : correspondances
  qui se chevauchent (séries, distance 1 comprise), longueur 3, correspondance qui touche la fin du
  tampon (chemin lent inchangé). Pas de #if : le chemin est compilé dans toutes les configurations, y
  compris clang avec UBSan (où miniz.h force MINIZ_USE_UNALIGNED_LOADS_AND_STORES à 0) et
  bee/tests/lancer.sh --sanitiseurs (gcc) ; le #error temporaire suggéré par la tâche est donc sans
  objet, et des mutants semés dans ce chemin sont détectés sous ASan et UBSan (voir teste).
  Pourquoi la copie 8 octets existante ne gagne pas, et ce qui gagne. Statistiques des
  correspondances du scénario de décompression (tout le corpus, niveau 6, outil local hors dépôt) :
  751 807 correspondances passent par la copie rapide (85,5 % des octets produits) ; longueur 3 :
  19,4 % des correspondances ; longueur 4 à 8 (distance >= 8) : 41,4 % des correspondances et 17,8 %
  des octets copiés ; longueur 9 et plus (distance >= 8) : 38,4 % et 70,0 % des octets ; distance
  inférieure à 8 : 0,8 % des correspondances et 8,0 % des octets (séries longues, 130 octets en
  moyenne). La condition du bloc existant (counter >= 9 et counter <= dist) couvre 38,3 % des
  correspondances et 67,3 % des octets : elle laisse à la boucle octet par octet les 61 % de
  correspondances courtes, ainsi que les restes de 3 à 7 octets. Mesuré sur cette machine, le bloc
  existant (base compilée avec MINIZ_USE_UNALIGNED_LOADS_AND_STORES=1 et MINIZ_UNALIGNED_USE_MEMCPY,
  ce qui change aussi MZ_READ_LE16/32, donc la mesure n'isole pas la seule copie) : -1,9 %
  d'instructions (34 164 249 -> 33 508 322) et aucun gain au chronomètre (deux séries de 10 paires :
  médiane -6,6 % avec B gagnant 4/10, puis +0,8 % en paires avec 5/10). Variantes essayées (outil
  local d'A/B entrelacé, binaires du banc, scénario décompression, 10 paires sauf mention ; mêmes
  instructions que ab.py) : blocs de 8 octets seuls (longueur >= 8, distance >= 16, chevauchement
  permis) : -7,1 % d'instructions, débit +6 à +9 % ; avec en plus les deux mouvements de 4 octets
  pour les longueurs 4 à 8 : -8,7 %, +15 % ; blocs de 16 octets en plus : -6,0 % seulement et pas de
  gain de plus, écartés ; seuils de distance 4, 8 ou 16 : indiscernables sur le corpus. L'essentiel
  du gain vient donc des correspondances de 4 à 8 octets, copiées sans boucle ; hypothèse non vérifiée
  faute de compteurs matériels dans la VM : la boucle octet par octet, au nombre de tours variable,
  coûte surtout en prédictions de branchement manquées. Pourquoi refuser le chevauchement : une
  première version qui l'acceptait dès la distance 8 gagnait autant sur le corpus (+13 à +17 %, trois
  passages d'ab.py), mais perdait 38 % de débit sur des données synthétiques périodiques de période 9
  à 15 (longues correspondances qui se chevauchent) et 7 à 11 % aux périodes 48 à 127 : un
  chargement de 8 octets qui recouvre en partie des écritures toutes récentes attend leur sortie du
  tampon d'écriture (échec de la redirection écriture-lecture). Des seuils de distance de 16 à 128
  pour les correspondances chevauchantes donnaient des résultats irréguliers selon la période ; la
  condition sans chevauchement est la seule qui reste neutre sur ces données (voir teste). Écartée
  aussi : memcpy(pOut_buf_cur, pSrc, counter) de la libc pour le même cas, -7,0 % d'instructions et
  +17,5 % au chronomètre (7/10) mais +11 % seulement sur des correspondances courtes synthétiques
  contre +14 % pour la version retenue, et dépendant du memcpy de chaque plate-forme.
