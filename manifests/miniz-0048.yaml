summary: "minizBee adopts the juge-v3 contract (parameters on descriptor 0, outputs at verification paths, ratio_n6 from timed outputs, the event's base, report checked) and pins juge-v3."
change: >
  The harness (bee/juge/execution.c) runs without arguments and reads its parameters as the fixed-length record that
  juge-v3's chrono writes on descriptor 0 (« <mode> /entrees /sorties », 256 bytes); it reads it to the end, keeps the
  folders and the mode's number, then erases the record, its arguments and its environment before any call to miniz.
  Each scenario writes an input's output at the path verification writes it (c/NAME.1, .6, .9; d/NAME and e/NAME;
  m/NAME), verification also writes m/NAME as the memoire scenario does, and the decompression scenario handles a
  stream in error as verification does (status, empty output) instead of stopping: juge-v3 mixes verification inputs,
  invalid streams included, into every measurement and compares each one byte for byte with its verification output.
  The unused --prefixe option is gone. The plugin (bee/juge/projet.py) checks every output of a scenario with the
  rule of verifier() (one decompressee() rule for both), checks m/NAME in verification, and computes ratio_n6 in
  scenario n6 from its timed outputs (fixes() stays, juge-v3 replaces its value); the input functions are unchanged
  (the frozen fingerprint test still passes). bee-ci.yml pins the registry's juge-v3 tag commit 3b21e97 instead of
  juge-v2 dab13a6 (isoler.sh, image, meta-tests, rapport.py at that commit); the juge job calls juge.yml@3b21e97 with
  the pull request's own base and head SHAs (github.event.pull_request, not a merge base); the greffon job keeps its
  « rebasez » checks (one starting point, same bee/ and miniz* in it and in the base) and then gives the base, rule
  base_de_la_pr, which verdict.py accepts only if A is the verdict's base; the verdict job checks the judge's report
  with rapport.py --verifier against toJSON(needs.juge.outputs) and the PR's base and head, and any non-zero exit
  writes juge_isole: echec. Transition: juge-v3 reads the plugin of the event's base only, and master's plugin and
  harness are written for juge-v2, so a PR whose base still pins juge-v2 (read in the base's own bee-ci.yml by the
  greffon job, output « contrat ») is judged as before by a juge-v2 job (juge.yml@dab13a6, from the starting point,
  rule point_de_depart), which the verdict job reads as « juge »; this PR is that case, and its meta-juge job runs
  its own plugin against juge-v3. Tests: test_juge.py gains unit tests for the scenarios (every output checked, a
  mixed-in invalid stream, ratio_n6 from timed outputs, each path a scenario reads is a verification path) and a
  meta-test variant, mesure_devinee, that guesses it is measured from its first call and compresses at level 1, with
  sortie_compressee=peut_changer; test_honnete also asserts mixed inputs and no fixed metric read on verification
  alone. test_verdict.py covers the new rule, both pins, the greffon step under both contracts, the report check
  and the transition. bee/README.md describes the contract, the new jobs and the threat-model rows.
