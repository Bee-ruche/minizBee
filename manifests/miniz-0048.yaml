doubts: >
  The transition adds a second judging job and a small remap of the jobs' results in the verdict job (verdict.py reads
  whichever judging job ran as « juge »), because master's verdict.py, which assembles this PR's verdict, counts any
  skipped job as failed and reads the code from « juge » only; both can go with the next version move (miniz-0050).
  The contract a base follows is read from the JUGE_COMMUN_SHA line of its own bee-ci.yml (data of the base, never
  executed): a base pinning neither juge-v3 nor juge-v2 is red. The new verdict.json value base_de_la_pr is French
  like the other values of base_juge.regle until miniz-0050 translates them (the registry's names.yaml will need it);
  the registry reads only base_juge.base and .commit. Measured values move under juge-v3 even on an honest PR: mixed-in
  verification inputs (the 4 MB one included) enter every scenario, and ratio_n6 is now computed on perturbed and
  mixed inputs; verdicts are the same (accepted, nothing beyond noise), not the figures. The plugin's SHA-256 changes
  and bee/ changes, so open fork PRs must rebase after the merge (the « rebasez » rule). The registry's
  common_judge_min stays 2 until the council raises it (libyamlBee also adopts juge-v3). This PR modifies bee/** and
  .github/workflows: a tooling task with judge paths, for a guardian or the council (R3).
