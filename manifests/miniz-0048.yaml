  - "The harness by hand in the sandbox (built as construire.sh does, with -Werror): every mode reads the 256-byte record on descriptor 0; each scenario's outputs (n1, n6, n9, decompression with valid, truncated, too-small-buffer and garbage streams, memoire) are byte-identical to verification's at the same paths; arguments, an extra field, an unknown mode or an empty record exit 2; an environment variable changes nothing. A copy of miniz.c whose mz_compress2 reports what it sees: environ empty, /proc/self/cmdline empty, descriptor 0 at end of file, in verification and in n6 alike."
