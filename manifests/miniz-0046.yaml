  CI's « rebasez » messages (bee-ci.yml). The help lines of the two
  lancer.sh are comments translated because the scripts print them; the other comments stay. The check names of the
  differential tests (brut, vidages, sommes, empreintes) stay as identifiers, as in bee/README.md. The juges.sh block
