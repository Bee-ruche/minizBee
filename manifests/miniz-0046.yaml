doubts: >
  The plugin's SHA-256 changes, as with any change to bee/juge/projet.py, so juge.greffon in later verdicts changes
  and open fork PRs must rebase after the merge (the greffon job's rule). The plugin's refusal and error messages
  reach the « juge » artifact (journal.txt with the pinned juge-v2; juge.json's juge.motif from juge-v3 on,
  ruche-0136), never verdict.json: verdict.py does not copy them. vocabulaire.py's messages reach
  details.origine_metrique only in a local simulation: in CI, the manifest job writes the task copy only after
  reading it with the same function, so an unreadable copy cannot reach verdict.py there. bee/README.md, English
  since miniz-0045 (merged into this branch), is edited where it quotes what this PR changes: ab.py's table verdict
  « DEGRADATION beyond noise » (its « within noise » already matched), and the line that called execution.c unchanged
  since miniz-0031 now says only its messages changed (outputs and instruction counts identical, above). It keeps
