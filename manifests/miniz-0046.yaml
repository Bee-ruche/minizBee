change: >
  One contribution in two parts, one PR (english-remaining.md §2): (a) bee/ci and bee/juge; (b) bench, tests, fuzz,
  sandbox and commun, one commit per area. Translated into English, string literals only. Part (a): what
  bee/ci/etape.sh, differentiel.sh, manifeste.sh, juges.sh (usage line), tache.py, vocabulaire.py, verifier_fork.py
  and verdict.py print (errors, usage lines, argparse descriptions and help, step banners), and what
  bee/juge/projet.py (the plugin's refusal and error messages), execution.c (the harness's error messages),
  construire.sh and test_juge.py print; bee/ci/test_verdict.py asserts the new texts, as strictly as before (« not
  found in the registry » where the old test said « introuvable »). Part (b): ab.py's errors, progress lines, warning,
  stderr table and help; profil.py's help and report lines; banc.c's messages and usage; differentiel.c's failure
  lines, errors and summary; api.c's case names, failure and warning lines and summary; tests/lancer.sh's and
  fuzz/lancer.sh's banners, errors and warnings, and the header comment lines each prints as its help (sed -n of its
  own lines 2 to 14 and 2 to 25: translated line for line, same line numbers); the fuzzing harnesses' and the random
  driver's messages, with the grep pattern of fuzz/lancer.sh that matches the driver's last line changed with it
  (« pilote: done »); graines.py's messages; sans-docker.sh's usage and refusals; corpus.c's errors. Registry names
  are the post-switch ones (bee manifest, bee check-fork, compressed_output: may_change, docs/security.md). French
  typography becomes English (« usage: », « code 1: », « +4.05% »); « » quotes stay, as in the registry's English
  messages. Wording follows libyamlBee's PR 5 where the two forks print the same message. Unchanged, by scope:
  verdict.json keys and values, including the step labels that become etape_en_echec, the details texts and
  verdict.py's own message for a missing or unreadable task copy, which becomes details.origine_metrique (miniz-0050);
  GITHUB_OUTPUT keys and values (tache=, metrique=aucune) and state files (succes, echec, oui); the plugin's METHODE
  text (it goes into juge.json); ab.py's JSON report (methode, ordre); profil.py's function labels, which go into
  profil.json (« (hors fonction) », « hors miniz (libc : memset, memcpy…) »); the header that differentiel.c writes
  into empreintes-reference.txt; the differential check names (miniz->zlib, flux-N, brut, vidages, sommes,
  empreintes), the harness's mode names and its « liste » file, option names and values (--sans-empreintes, tout,
  memoire…), metric ids, artifact names (crash-*), exit codes, test data (api.c's words, test_profil.py's example,
  test_juge.py's bytes); code comments and docstrings, except the docstring first lines that argparse prints
  (tache.py, verifier_fork.py, profil.py, graines.py) and the header lines the two lancer.sh print as help. Also
