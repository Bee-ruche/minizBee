summary: "minizBee moves to judge-v4 (juge-v3 kept for the transition) and writes English: verdict.json, metric ids, the plugin (bee/judge/project.py), ab.py's report, bee-ci.yml."
change: >
  bee-ci.yml pins judge-v4, the registry's commit 7623c12 the founder tags judge-v4: the judge job calls
  judge.yml@7623c12 with its English inputs (head_sha, history); JUGE_COMMUN_SHA is that commit; the image comes from
  tools/judge/judge.py --tooling … --image-only and ISOLER is tools/judge/isoler.sh; the verdict job downloads the
  artifact judge and checks results' judge.json with report.py --verify against toJSON(needs.judge.outputs). The
  greffon job reads the base's pin: judge-v4, or juge-v3 for the transition (any other pin, juge-v2's included, is
  refused). A base that pins juge-v3 (this PR) is judged by the old version and by the new one: the juge-v3 job
  (juge.yml@3b21e97), whose artifact juge the base's French verdict.py reads, and the judge-v4 job, whose report is
  checked too; the juge-ancien job runs only then, because that verdict.py still requires its step. juge-v2's
  transition (JUGE_V2_SHA, the juge-v2 job, the point_de_depart and introduction rules, BEE_JUGES's introduction of
  the plugin) is gone. The workflow comes from the PR and the scripts from the base, so their interfaces keep their
  French names and values (state files, job ids, artifacts etat-*, outputs regle, sortie_compressee…). The plugin
  moves to bee/judge/ (project.py with judge-v4's English contract: Project, NAME, PACKAGES, REQUIRED_SOURCES,
  TOOLING, BASE_HEADERS, BUILD, ALLOWED, SIDES, METRICS higher/lower, METHOD, verify, fixed; build.sh;
  test_judge.py against tools/judge, English options and report keys); its input functions are unchanged (the
  frozen fingerprint test passes). verdict.json is English (names.yaml fork_verdict; the steps and details keys as
  libyamlBee #6; failed_step labels in English; judge_base.rule pr_base); verdict.py reads judge.json's English keys
  and accepts judge-vN. Metric ids are English where the fork writes them (banc.c, ab.py, the plugin, verdict.json);
  the registry's French ids are still read (vocabulaire.py METRIQUES_FR) until ruche-0149's M2. ab.py's report keys
  are English (ab_report, judge_report). miniz-0049's French registry fallbacks are dropped (taches/, outils/,
  French task keys, verifier-fork, --registre; the outils/requirements.txt step); manifests are still read in either
  vocabulary and from manifestes/. bee-ci.yml's step names, notices, comments and fallback verdict are English;
  BEE_JUGES and bee/ci/juges.sh stay identical. README: judge-v4, the CI table, verdict.json, the Dockerfile built
  (miniz-0003) but not pinned by digest, the file tree's five omissions, the « Common judge and plugin » pointer.
