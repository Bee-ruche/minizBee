# CI Bee du fork miniz (https://github.com/Bee-ruche/minizBee). Fork indépendant, non affilié au projet miniz.
#
# Étapes, dans l'ordre (la première en échec est rapportée, voir docs/evaluation.md du registre Bee) :
#   1. manifeste et taille : bee verifier-fork (check-fork), avec l'outil du registre (branche main, lu dans ses deux
#      vocabulaires, français et anglais : docs/english-migration.md du registre ; bee/ci/vocabulaire.py)
#   2. compilation et tests d'origine de miniz, x86-64 et ARM64
#   3. tests différentiels contre zlib et empreintes de déterminisme, x86-64 et ARM64
#   4. fuzzing libFuzzer, 2 harnais en parallèle pendant 10 minutes, x86-64
#   5. juge commun du registre (workflow réutilisable juge.yml de juge-v3, épinglé par SHA) avec le greffon de
#      minizBee (bee/juge/projet.py) lu dans la BASE : base de la PR (celle de l'événement) contre tête de la PR ;
#      vérification de toutes les sorties par l'hôte (zlib de l'hôte, entrées tirées
#      au hasard), mesures entrelacées (10 répétitions) et décompte d'instructions Cachegrind, tout en
#      conteneur ; analyse des objets compilés (constructions suspectes). The verdict job checks the judge's
#      report against its job's outputs (rapport.py --verifier). Transition: a base whose plugin is still
#      written for juge-v2 (the PR that adopts juge-v3, miniz-0048) is judged by juge-v2, from its starting point
#   6. ancien juge isolé (bee/juge/juge.py), tant qu'une base en a encore un (transition, miniz-0032)
#   7. méta-tests du greffon contre le juge commun, seulement si la PR modifie bee/juge/ ou ce workflow
#   8. verdict.json, publié en artefact « verdict » (lu par le workflow verdicts.yml du registre)
#
# Sécurité :
#   - permissions: contents: read pour tout le workflow ; aucun secret ; checkouts sans identifiants
#     conservés (persist-credentials: false). Déclencheur pull_request (jamais pull_request_target) :
#     pour une PR venant d'un fork, GitHub ne fournit de toute façon ni secret ni jeton en écriture.
#   - les juges (tests, corpus, banc, fuzzing, scripts de CI) viennent de la BASE de la PR ; seules les
#     sources de miniz viennent de la PR, qui ne peut pas assouplir ces fichiers-là.
#   - MAIS ce fichier de workflow est celui de la PR (déclencheur pull_request) : une PR qui modifie
#     .github/ ou bee/ peut fabriquer son propre verdict. Le registre le détecte de son côté (liste des
#     fichiers de la PR lue auprès de l'API GitHub, verdicts.yml) : verdict refusé pour une optimisation,
#     relecture du conseil ou d'un Confirmé exigée pour une tâche d'outillage (R3).
#   - le manifeste (manifests/<tâche>.yaml ou manifestes/) et la tâche du registre sont des données (yaml.safe_load), jamais exécutées ;
#     les valeurs qui en sortent sont validées contre des listes fermées.
#   - « ci » est décidée par le job verdict à partir du résultat des jobs (needs.*.result), que le code
#     de la PR ne peut pas réécrire ; les fichiers d'état servent seulement à nommer l'étape en échec.
#   - le code C de la PR ne s'exécute JAMAIS sur la machine de CI elle-même : compilation, tests,
#     fuzzing et mesures tournent dans le conteneur du juge commun (sans réseau, lecture seule, sans
#     privilège), sur des copies jetables. isoler.sh et l'image viennent du registre au commit JUGE_COMMUN_SHA ;
#     juge.yml est appelé à ce commit et en extrait lui-même le juge (ruche-0024 : jamais une étiquette).
#     L'image est construite avant que le moindre fichier de la PR ne soit monté. Le commit du corpus
#     (2948eeb) est déclaré à juge.yml (historique) et récupéré avant la PR ; aucun réseau ensuite.
#   - le greffon (bee/juge/projet.py) est lu dans la BASE, jamais dans la PR : seule la PR qui l'introduit
#     (bee/ci/juges.sh, « introduction du greffon ») est jugée avec le sien, en amorçage (amorcage: true).
#   - les étapes 2 à 4 restent des contrôles « de l'intérieur » : un code malveillant peut fausser ses
#     propres tests (exit(0) au milieu, par exemple) mais pas en sortir. Le juge commun (étape 5), lui,
#     vérifie les sorties de l'extérieur, avec des entrées qu'aucun code ne connaît d'avance, et mesure
#     les temps par le noyau : c'est lui qui fait foi. Modèle de menace : bee/README.md, section « Juge commun et greffon ».
name: bee-ci

on:
  pull_request:
    # Seules les PR vers master sont jugées : une PR vers une vieille branche serait jugée par les juges de
    # cette branche, puis pourrait être rebasculée vers master sans nouvelle exécution (revue adverse).
    branches: [master]

permissions:
  contents: read

concurrency:
  group: bee-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  TETE_SHA: ${{ github.event.pull_request.head.sha }}
  REGISTRE: Bee-ruche/registre
  # The common judge's version: judge-v4, the registry's commit the founder tags judge-v4 (ruche-0148, merge of PR #348,
  # 11/11/2026; judge.yml itself refuses a commit that is not on the registry's main branch). Pinned by SHA, not by the tag: a tag moves, and a branch of the
  # same name would hide it (adversarial review of miniz-0032). The same SHA as in the « uses: » of the judge job (an
  # expression is not allowed there); bee/ci/test_verdict.py checks that they are equal.
  JUGE_COMMUN_SHA: "7623c1288482673f48171bb7ed921f447ac272d9"  # judge-v4
  # The previous version, juge-v3 (PR #184, 2/11/2026), for the transition only: the juge-v3 job judges a
  # PR whose base pins it (the base's verdict.py reads juge-v3's report). The same SHA as in that job's « uses: ».
  JUGE_V3_SHA: "3b21e97a89c25ddcfbb3c0d28d1086b801c991bc"  # juge-v3
  ETATS: ${{ github.workspace }}/etats
  # Amorçage : la première PR, qui apporte bee/, a pour base le master d'origine, sans juges.
  # Pour CE commit seulement, les juges viennent de la PR elle-même (verdict : amorcage: true).
  BEE_COMMIT_AMORCAGE: 2948eebafc5b9f1c69bebed80333e403a09bd62d
  # Logique de bee/ci/juges.sh (copie identique, vérifiée par bee/ci/test_verdict.py), exécutée par
  # l'étape « Juges » de chaque job : à l'amorçage, la base ne contient pas encore ce script.
  # Variables attendues : base, pr, base_sha, etats.
  BEE_JUGES: |
    mkdir -p "$etats"
    if [ -f "$base/bee/ci/etape.sh" ]; then
      echo "Judges: bee/ of the PR's base ($base_sha), the common judge's plugin included."
      echo "base" > "$etats/greffon.txt"
      echo "succes" > "$etats/juges.txt"
    elif [ "$base_sha" = "$BEE_COMMIT_AMORCAGE" ] && [ -f "$pr/bee/ci/etape.sh" ]; then
      echo "::warning::BOOTSTRAP: the base $base_sha (pinned bootstrap commit) does not contain bee/; the judges come from the PR itself (verdict.json: bootstrap: true)."
      rm -rf "$base/bee"
      cp -a "$pr/bee" "$base/bee"
      mkdir -p "$base/.github/workflows"
      cp -a "$pr/.github/workflows/bee-ci.yml" "$base/.github/workflows/bee-ci.yml"
      echo "pr" > "$etats/greffon.txt"
      echo "oui" > "$etats/amorcage.txt"
      echo "succes" > "$etats/juges.txt"
    else
      echo "echec" > "$etats/juges.txt"
      echo "::error::The PR's base ($base_sha) does not contain bee/: no judges, CI refused (only the bootstrap commit $BEE_COMMIT_AMORCAGE is accepted without judges)." >&2
      exit 1
    fi

  # Conteneur du juge commun (juge-commun/ : le registre au commit JUGE_COMMUN_SHA), après l'étape « Juges » :
  # isoler.sh du registre et l'image commune avec les paquets du greffon (de la base ; de la PR en amorçage).
  BEE_IMAGE: |
    chmod +x juge-commun/tools/judge/isoler.sh
    greffon=base
    if [ "$(cat "$ETATS/greffon.txt")" = "pr" ]; then greffon=pr; fi
    image="$(python3 juge-commun/tools/judge/judge.py --tooling "$greffon" --image-only)"
    echo "ISOLER=$GITHUB_WORKSPACE/juge-commun/tools/judge/isoler.sh" >> "$GITHUB_ENV"
    echo "IMAGE=$image" >> "$GITHUB_ENV"
  # Copie de travail jetable pour une étape conteneurisée : la base et la PR, fraîches.
  BEE_TRAVAIL: |
    travail="$RUNNER_TEMP/travail-$1"
    rm -rf "$travail"
    mkdir -p "$travail"
    cp -a base "$travail/base"
    cp -a pr "$travail/pr"
    echo "$travail"

jobs:
  manifeste:
    name: Manifeste et taille
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tache: ${{ steps.manifeste.outputs.tache }}
      type: ${{ steps.manifeste.outputs.type }}
      metrique: ${{ steps.manifeste.outputs.metrique }}
      sortie_compressee: ${{ steps.manifeste.outputs.sortie_compressee }}
    steps:
      - name: Base de la PR (juges)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Tête de la PR (historique complet, pour le diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Registre Bee (branche main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: main
          path: registre
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dependencies of the bee tool (the registry's tools/requirements.txt)
        run: pip install -r registre/tools/requirements.txt
      - name: Unit tests of the base's tooling (ab.py, verdict.py)
        run: |
          python3 base/bee/bench/test_ab.py
          python3 base/bee/ci/test_verdict.py
          python3 base/bee/bench/test_profil.py
      - name: Manifeste, tâche, R1 et commandement 3
        id: manifeste
        env:
          AUTEUR: ${{ github.event.pull_request.user.login }}
          BEE_SORTIE_TACHE: ${{ github.workspace }}/donnees/tache.yaml
        run: |
          mkdir -p donnees
          base/bee/ci/etape.sh "$ETATS" manifeste_et_taille base/bee/ci/manifeste.sh pr registre python3
      - name: Conserver le manifeste, la tâche et l'état
        if: always()
        env:
          MANIFESTE: ${{ steps.manifeste.outputs.manifeste }}
        run: |
          mkdir -p donnees
          # Nom validé par bee/ci/manifeste.sh (manifests/ ou manifestes/miniz-NNNN.yaml, ou CONTRIBUTION.yaml) ;
          # un manifeste est un fichier ordinaire : ni lien symbolique ni dossier n'est copié.
          case "$MANIFESTE" in
            manifests/miniz-[0-9][0-9][0-9][0-9].yaml|manifestes/miniz-[0-9][0-9][0-9][0-9].yaml|CONTRIBUTION.yaml)
              if [ -f "pr/$MANIFESTE" ] && [ ! -L "pr/$MANIFESTE" ]; then cp "pr/$MANIFESTE" donnees/CONTRIBUTION.yaml 2>/dev/null || true; fi ;;
          esac
          cp -r "$ETATS" donnees/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-manifeste
          path: donnees/
          if-no-files-found: warn

  # Le commit que le juge commun extrait comme base : son bee/juge/projet.py est le greffon et ses sources
  # sont A. Sous juge-v2, LE point de départ de la PR (un seul merge-base), dont bee/ et miniz* doivent être ceux
  # de la base : tout ce que le juge lit dans A. Sinon la CI est rouge (« rebasez »), car A ne serait pas ce
  # que la PR change dans master : comparer la base à une tête qui n'a pas ses changements, ou un point de
  # départ à une tête qui a recopié (squash, cherry-pick) ce que master a reçu depuis, attribuerait à la PR
  # le travail d'un autre (revues adverses de miniz-0032 : +19 % fabriqué, faux refus d'une PR non rebasée,
  # gain d'une optimisation recopiée, criss-cross). Jamais la PR, sauf pour la PR qui introduit le greffon
  # (bee/ci/juges.sh), qui ne touche pas miniz : ses sources sont alors exactement celles du point de départ.
  # Le commit retenu et la règle qui l'a choisi sont publiés dans verdict.json (base_juge).
  # Since juge-v3 (miniz-0048), juge.yml judges only the event's base: A is the PR's base (rule base_de_la_pr), under
  # the same condition (one starting point, whose bee/ and miniz* are the base's), so its content is the starting
  # point's. The starting point itself and the introduction remain for a base that still pins juge-v2 (job juge-v2).
  greffon:
    name: Greffon du juge commun
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_juge: ${{ steps.greffon.outputs.base_juge }}
      regle: ${{ steps.greffon.outputs.regle }}
      depart: ${{ steps.greffon.outputs.depart }}
      contrat: ${{ steps.greffon.outputs.contrat }}
    steps:
      - name: Base de la PR (juges)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Tête de la PR (historique complet, qui contient la base et le point de départ)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Commit du greffon et de A pour le juge commun
        id: greffon
        run: |
          echo "echec" > "$ETATS/greffon_juge.txt"
          departs="$(git -C pr merge-base --all "$BASE_SHA" "$TETE_SHA" || true)"
          if [ "$(printf '%s\n' "$departs" | grep -c .)" -ne 1 ]; then
            echo "regle=refus_point_de_depart" >> "$GITHUB_OUTPUT"
            echo "::error::This PR does not have a single starting point on master (merge-base --all: $(printf '%s ' $departs)): rebase it on master ($BASE_SHA)." >&2
            exit 1
          fi
          depart="$departs"
          echo "depart=$depart" >> "$GITHUB_OUTPUT"
          if ! git -C pr diff --quiet "$depart" "$BASE_SHA" -- bee 'miniz*'; then
            echo "regle=refus_rebase" >> "$GITHUB_OUTPUT"
            echo "::error::bee/ or miniz has changed on master since this PR's starting point ($depart): rebase it on master ($BASE_SHA). The common judge measures a PR only against what it changes in master." >&2
            exit 1
          fi
          # The judge the base's plugin and harness are written for: the one the base's bee-ci.yml pins (they change
          # together, in one PR, whose meta-tests run its plugin against its pin). juge-v3 judges the event's base.
          epingle="$(sed -n 's/^  JUGE_COMMUN_SHA: "\([0-9a-f]\{40\}\)".*/\1/p' base/.github/workflows/bee-ci.yml)"
          if [ "$(cat "$ETATS/greffon.txt")" != "base" ]; then
            echo "::error::The common judge reads the plugin of the PR's base only, and this base has none (bootstrap)." >&2
            exit 1
          fi
          case "$epingle" in
            "$JUGE_COMMUN_SHA") echo "contrat=judge-v4" >> "$GITHUB_OUTPUT" ;;
            "$JUGE_V3_SHA") echo "contrat=juge-v3" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::The base pins neither judge-v4 nor juge-v3 (${epingle:-no JUGE_COMMUN_SHA}): no common judge for its plugin." >&2
               exit 1 ;;
          esac
          base_juge="$BASE_SHA"
          regle=base_de_la_pr
          echo "Common judge: plugin and A read at $base_juge, rule $regle (base $BASE_SHA, starting point $depart, head $TETE_SHA)."
          echo "base_juge=$base_juge" >> "$GITHUB_OUTPUT"
          echo "regle=$regle" >> "$GITHUB_OUTPUT"
          echo "succes" > "$ETATS/greffon_juge.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-greffon
          path: etats/
          if-no-files-found: warn

  compilation-et-tests:
    name: Compilation et tests (${{ matrix.arch }})
    needs: manifeste
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            machine: ubuntu-24.04
          - arch: arm64
            machine: ubuntu-24.04-arm
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 30
    steps:
      - name: Base de la PR (juges ; historique complet pour le corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Common judge (registry, at the pinned commit of judge-v4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_COMMUN_SHA }}
          path: juge-commun
          persist-credentials: false
      - name: Image du conteneur du juge commun (réseau pour docker build, avant d'exécuter quoi que ce soit de la PR)
        run: eval "$BEE_IMAGE"
      - name: Compilation et tests d'origine de miniz (conteneur sans réseau)
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- compilation)"
          base/bee/ci/etape.sh "$ETATS" compilation_${{ matrix.arch }} "$ISOLER" "$IMAGE" "$travail" -- \
            /travail/base/bee/ci/tests_origine.sh /travail/pr /travail/cmake
      - name: Tests différentiels et empreintes (conteneur sans réseau)
        if: always()
        env:
          SORTIE_COMPRESSEE: ${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- differentiel)"
          base/bee/ci/etape.sh "$ETATS" differentiel_${{ matrix.arch }} "$ISOLER" "$IMAGE" "$travail" -- \
            env SORTIE_COMPRESSEE="$SORTIE_COMPRESSEE" BASE_SHA="$BASE_SHA" TETE_SHA="$TETE_SHA" \
            /travail/base/bee/ci/differentiel.sh /travail/pr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-tests-${{ matrix.arch }}
          path: etats/
          if-no-files-found: warn

  fuzzing:
    name: Fuzzing 10 minutes (x86-64)
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Base de la PR (harnais ; historique complet pour le corpus de graines)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Common judge (registry, at the pinned commit of judge-v4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_COMMUN_SHA }}
          path: juge-commun
          persist-credentials: false
      - name: Image du conteneur du juge commun (réseau pour docker build, avant d'exécuter quoi que ce soit de la PR)
        run: eval "$BEE_IMAGE"
      # Les entrées fautives, les journaux de libFuzzer et les traces ne quittent JAMAIS la machine de
      # CI : journaux et artefacts d'un dépôt public sont publics (docs/securite.md du registre).
      # lancer.sh est en mode discret sous GitHub Actions (empreintes seulement) et rejoue chaque
      # entrée fautive sur la base : un écart qui y existe déjà est signalé sans compter contre la PR.
      - name: Fuzzing différentiel, 2 harnais en parallèle, 600 s chacun (conteneur sans réseau)
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- fuzzing)"
          base/bee/ci/etape.sh "$ETATS" fuzzing "$ISOLER" "$IMAGE" "$travail" -- \
            env CLANG=clang-18 BEE_FUZZ_SORTIES=/travail/sorties-fuzz BEE_FUZZ_DISCRET=1 GITHUB_ACTIONS=true \
            /travail/base/bee/fuzz/lancer.sh 600 --source /travail/pr --reference /travail/base
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-fuzzing
          path: etats/
          if-no-files-found: warn

  # The registry's common judge, judge.yml of judge-v4 pinned by SHA: it judges the PR's head against its base, the
  # event's (judge.yml compares them with github.event.pull_request), with the base's plugin, and publishes the artifact
  # « judge » (judge.json, code, log.txt, outputs) and, as job outputs, the report's SHA-256 and key figures, which the
  # verdict job checks (report.py --verify). The job never turns red because of B: verdict.py reads the code (0 correct,
  # 1 refused, 2 environment). History: the corpus commit (2948eeb), which judge.yml checks in the base's ancestry and
  # fetches before the PR. judge-v4 also reads the French plugin (bee/juge/projet.py): it judges a base that pins juge-v3 too.
  judge:
    name: Common judge
    needs: [manifeste, greffon]
    if: always() && needs.greffon.result == 'success'
    uses: Bee-ruche/registre/.github/workflows/judge.yml@7623c1288482673f48171bb7ed921f447ac272d9 # judge-v4
    with:
      history: 2948eebafc5b9f1c69bebed80333e403a09bd62d
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      options: sortie_compressee=${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}

  # Transition to judge-v4: a base that still pins juge-v3 (the PR that adopts judge-v4, miniz-0050) is judged by the old
  # version and by the new one. Its verdict.py reads juge-v3's artifact « juge »; the verdict job reads this job as « juge ».
  juge-v3:
    name: Common judge, juge-v3 (transition)
    needs: [manifeste, greffon]
    if: always() && needs.greffon.result == 'success' && needs.greffon.outputs.contrat == 'juge-v3'
    uses: Bee-ruche/registre/.github/workflows/juge.yml@3b21e97a89c25ddcfbb3c0d28d1086b801c991bc # juge-v3
    with:
      historique: 2948eebafc5b9f1c69bebed80333e403a09bd62d
      base_sha: ${{ github.event.pull_request.base.sha }}
      tete_sha: ${{ github.event.pull_request.head.sha }}
      options: sortie_compressee=${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}

  # Transition : tant que la base a encore l'ancien juge isolé (bee/juge/juge.py, version 2), il juge aussi
  # la PR, comme avant. C'est le cas de toute PR vers master tant que miniz-0032 n'y est pas fusionnée ;
  # ensuite master n'en a plus et ce job ne fait rien.
  juge-ancien:
    name: Old isolated judge of the base (juge-v3 transition)
    needs: [manifeste, greffon]
    if: always() && needs.greffon.outputs.contrat == 'juge-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Base of the PR (judges)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: The base has no old isolated judge (bee/juge/juge.py)
        run: |
          if [ -e base/bee/juge/juge.py ]; then
            echo "::error::The base still has the old isolated judge (bee/juge/juge.py), which this workflow no longer runs." >&2
            exit 1
          fi
          echo "succes" > "$ETATS/juge_ancien.txt"
      - name: Keep the state
        if: always()
        run: |
          mkdir -p conserver
          cp -r "$ETATS" conserver/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-juge-ancien
          path: conserver/
          if-no-files-found: warn

  # Exécute du code de la PR (bee/juge/test_juge.py) sur la machine de CI quand elle modifie bee/juge/ ou ce
  # workflow : job à part, en lecture seule, sans secret ni identifiant conservé, sans artefact ni sortie.
  # Seul son résultat compte (needs du verdict) : verdict.json reste assemblé par l'outillage de la base.
  meta-juge:
    name: Méta-tests du greffon (juge commun)
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Base de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR (historique complet, pour le diff et le corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Common judge (registry, at the pinned commit of judge-v4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_COMMUN_SHA }}
          path: juge-commun
          persist-credentials: false
      # Une PR qui modifie bee/juge/ (greffon, harnais) ou la version du juge commun doit prouver que le juge
      # commun, avec SON greffon, attrape des variantes malveillantes de miniz (bee/juge/test_juge.py),
      # compilées et lancées en conteneur.
      - name: Méta-tests (seulement si la PR modifie bee/juge/ ou ce workflow)
        run: |
          if git -C pr diff --quiet "$BASE_SHA...$TETE_SHA" -- bee/judge bee/juge .github/workflows/bee-ci.yml; then
            echo "bee/judge/ and bee-ci.yml unchanged by the PR: no meta-tests."
            mkdir -p "$ETATS" && echo "succes" > "$ETATS/meta_juge.txt"
            exit 0
          fi
          base/bee/ci/etape.sh "$ETATS" meta_juge env BEE_JUDGE_INTEGRATION=1 PYTHONDONTWRITEBYTECODE=1 \
            BEE_COMMON_JUDGE="$GITHUB_WORKSPACE/juge-commun/tools/judge" python3 pr/bee/judge/test_judge.py
      # No artifact: the PR's code ran in this job, nothing it may have written reaches the verdict.

  # Tests de l'outillage de CI de la PR (bee/ci/test_verdict.py) quand elle modifie bee/ci/ ou ce workflow : le
  # job manifeste ne lance que ceux de la base. Mêmes conditions que meta-juge : code de la PR sur la machine
  # de CI, donc job à part, en lecture seule, sans secret ni identifiant conservé, sans artefact ni sortie ;
  # seul son résultat compte, et verdict.json reste assemblé par l'outillage de la base.
  outillage-pr:
    name: Tests de l'outillage de CI de la PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Tête de la PR (historique complet, pour le diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PyYAML (lecture du workflow par les tests)
        run: pip install "pyyaml==6.0.2"
      - name: Tests de l'outillage de CI de la PR (seulement si la PR modifie bee/ci/ ou ce workflow)
        run: |
          if git -C pr diff --quiet "$BASE_SHA...$TETE_SHA" -- bee/ci .github/workflows/bee-ci.yml; then
            echo "bee/ci/ and bee-ci.yml unchanged by the PR: the base's tests are enough (manifeste job)."
            exit 0
          fi
          python3 pr/bee/ci/test_verdict.py

  verdict:
    name: Verdict
    needs: [manifeste, greffon, compilation-et-tests, fuzzing, judge, juge-v3, juge-ancien, meta-juge, outillage-pr]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Base de la PR (verdict.py)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Historique de la PR (lu par git diff seulement, pour compter les lignes)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        id: juges
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PyYAML (lecture du manifeste et de la tâche)
        run: pip install "pyyaml==6.0.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: etat-*
          path: artefacts
      - name: The common judge's report (artifact « judge »; missing if the judge did not run)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: judge
          path: artefacts/judge
      - name: juge-v3's report (artifact « juge », transition; missing if it did not run)
        if: needs.greffon.outputs.contrat == 'juge-v3'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: juge
          path: artefacts/juge
      - name: Common judge (registry, at the pinned commit of judge-v4; report.py)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_COMMUN_SHA }}
          path: juge-commun
          persist-credentials: false
      - name: Common judge, juge-v3 (registry, at its pinned commit; rapport.py, transition)
        if: needs.greffon.outputs.contrat == 'juge-v3'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_V3_SHA }}
          path: juge-v3
          persist-credentials: false
      # The report read here must be the one the judging job published (SHA-256 and key figures, its job outputs), with
      # code 0 and the PR's base and head; otherwise the judge's step fails (juge_isole: echec). Under the juge-v3
      # transition, both judges' reports are checked.
      - name: Common judge's report checked against its job's outputs (report.py --verify)
        env:
          SORTIES_JUGE: ${{ toJSON(needs.judge.outputs) }}
        run: |
          printf '%s' "$SORTIES_JUGE" > sorties-judge.json
          if ! python3 juge-commun/tools/judge/report.py artefacts/judge/judge.json --verify sorties-judge.json --base "$BASE_SHA" --head "$TETE_SHA"; then
            echo "echec" > "$ETATS/juge_isole.txt"
            echo "::error::The common judge's report is not the one its job published, or its code is not 0, or it names other commits than the PR's: the judge's step fails." >&2
          fi
      - name: juge-v3's report checked against its job's outputs (rapport.py --verifier, transition)
        if: needs.greffon.outputs.contrat == 'juge-v3'
        env:
          SORTIES_JUGE: ${{ toJSON(needs.juge-v3.outputs) }}
        run: |
          printf '%s' "$SORTIES_JUGE" > sorties-juge.json
          if ! python3 juge-v3/outils/juge/rapport.py artefacts/juge/juge.json --verifier sorties-juge.json --base "$BASE_SHA" --tete "$TETE_SHA"; then
            echo "echec" > "$ETATS/juge_isole.txt"
            echo "::error::juge-v3's report is not the one its job published, or its code is not 0, or it names other commits than the PR's: the judge's step fails." >&2
          fi
      - name: Assemble verdict.json
        env:
          RESULTATS_JOBS: ${{ toJSON(needs) }}
          CONTRAT: ${{ needs.greffon.outputs.contrat }}
        run: |
          # Transition to juge-v3: one of the two judging jobs runs, the one the base's plugin is written for (greffon
          # job); verdict.py reads it as « juge », and the other one, skipped, is left out.
          python3 - > resultats-jobs.json <<'FIN'
          import json, os
          jobs = json.loads(os.environ["RESULTATS_JOBS"])
          v3, ancien = jobs.pop("juge-v3", None), jobs.pop("juge-ancien", None)
          if os.environ.get("CONTRAT") == "juge-v3":
              jobs.update({"juge": v3, "juge-ancien": ancien})
          print(json.dumps(jobs))
          FIN
          verdict=base/bee/ci/verdict.py
          juge=artefacts/judge
          if [ "$CONTRAT" = "juge-v3" ]; then juge=artefacts/juge; fi
          if [ "$(cat "$ETATS/greffon.txt")" = "pr" ]; then
            # The same rule as for the plugin: only at bootstrap does the PR bring the assembler.
            echo "::warning::The base has no bee/ (bootstrap): the PR's verdict assembler is used (tooling task, a guardian's review required by the registry)."
            verdict=pr/bee/ci/verdict.py
          fi
          python3 "$verdict" --artefacts artefacts --juge "$juge" --etats "$ETATS" --jobs resultats-jobs.json \
            --depot pr --base "$BASE_SHA" --tete "$TETE_SHA" --sortie verdict.json
          cat verdict.json
      - name: Verdict de repli (base sans juges, verdict.py indisponible)
        if: failure() && steps.juges.outcome == 'failure'
        run: |
          printf '%s\n' '{"ci": "red", "failed_step": "Judges (base without bee/)", "gain": null, "metric": null, "beyond_noise": false, "measurements": {"A": {}, "B": {}}, "instructions": null, "degradations": {}, "changed_lines": null, "bootstrap": false}' > verdict.json
          cat verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verdict
          path: verdict.json
          if-no-files-found: error
      - name: CI rouge si une étape a échoué
        run: |
          python3 -c 'import json, sys; v = json.load(open("verdict.json")); print("CI", v["ci"], v.get("failed_step", v.get("etape_en_echec", ""))); sys.exit(v["ci"] not in ("green", "verte"))'
