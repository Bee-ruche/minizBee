# CI Bee du fork miniz (https://github.com/Bee-ruche/minizBee). Fork indépendant, non affilié au projet miniz.
#
# Étapes, dans l'ordre (la première en échec est rapportée, voir docs/evaluation.md du registre Bee) :
#   1. manifeste et taille : bee verifier-fork, avec l'outil du registre (branche main)
#   2. compilation et tests d'origine de miniz, x86-64 et ARM64
#   3. tests différentiels contre zlib et empreintes de déterminisme, x86-64 et ARM64
#   4. fuzzing libFuzzer, 2 harnais en parallèle pendant 10 minutes, x86-64
#   5. juge commun du registre (workflow réutilisable juge.yml de juge-v1, épinglé par SHA) avec le greffon de
#      minizBee (bee/juge/projet.py) lu dans la BASE : point de départ de la PR (merge-base avec la base)
#      contre tête de la PR ; vérification de toutes les sorties par l'hôte (zlib de l'hôte, entrées tirées
#      au hasard), mesures entrelacées (10 répétitions) et décompte d'instructions Cachegrind, tout en
#      conteneur ; analyse des objets compilés (constructions suspectes)
#   6. ancien juge isolé (bee/juge/juge.py), tant qu'une base en a encore un (transition, miniz-0032)
#   7. méta-tests du greffon contre le juge commun, seulement si la PR modifie bee/juge/ ou ce workflow
#   8. verdict.json, publié en artefact « verdict » (lu par le workflow verdicts.yml du registre)
#
# Sécurité :
#   - permissions: contents: read pour tout le workflow ; aucun secret ; checkouts sans identifiants
#     conservés (persist-credentials: false). Déclencheur pull_request (jamais pull_request_target) :
#     pour une PR venant d'un fork, GitHub ne fournit de toute façon ni secret ni jeton en écriture.
#   - les juges (tests, corpus, banc, fuzzing, scripts de CI) viennent de la BASE de la PR ; seules les
#     sources de miniz viennent de la PR, qui ne peut pas assouplir ces fichiers-là.
#   - MAIS ce fichier de workflow est celui de la PR (déclencheur pull_request) : une PR qui modifie
#     .github/ ou bee/ peut fabriquer son propre verdict. Le registre le détecte de son côté (liste des
#     fichiers de la PR lue auprès de l'API GitHub, verdicts.yml) : verdict refusé pour une optimisation,
#     relecture du conseil ou d'un Confirmé exigée pour une tâche d'outillage (R3).
#   - le manifeste (manifestes/<tâche>.yaml) et la tâche du registre sont des données (yaml.safe_load), jamais exécutées ;
#     les valeurs qui en sortent sont validées contre des listes fermées.
#   - « ci » est décidée par le job verdict à partir du résultat des jobs (needs.*.result), que le code
#     de la PR ne peut pas réécrire ; les fichiers d'état servent seulement à nommer l'étape en échec.
#   - le code C de la PR ne s'exécute JAMAIS sur la machine de CI elle-même : compilation, tests,
#     fuzzing et mesures tournent dans le conteneur du juge commun (sans réseau, lecture seule, sans
#     privilège), sur des copies jetables. isoler.sh et l'image viennent du registre au commit JUGE_COMMUN_SHA ;
#     juge.yml est appelé à ce commit, mais il extrait encore lui-même juge.py à l'étiquette juge-v1 (voir le
#     job juge), tant que ruche-0024 n'est pas faite dans le registre.
#     L'image est construite avant que le moindre fichier de la PR ne soit monté. Sur l'hôte, le greffon fait
#     aussi un git fetch d'un SHA fixe pour le corpus (bee/juge/projet.py), après l'extraction de la PR.
#   - le greffon (bee/juge/projet.py) est lu dans la BASE, jamais dans la PR : seule la PR qui l'introduit
#     (bee/ci/juges.sh, « introduction du greffon ») est jugée avec le sien, en amorçage (amorcage: true).
#   - les étapes 2 à 4 restent des contrôles « de l'intérieur » : un code malveillant peut fausser ses
#     propres tests (exit(0) au milieu, par exemple) mais pas en sortir. Le juge commun (étape 5), lui,
#     vérifie les sorties de l'extérieur, avec des entrées qu'aucun code ne connaît d'avance, et mesure
#     les temps par le noyau : c'est lui qui fait foi. Modèle de menace : bee/README.md, section « Juge commun et greffon ».
name: bee-ci

on:
  pull_request:
    # Seules les PR vers master sont jugées : une PR vers une vieille branche serait jugée par les juges de
    # cette branche, puis pourrait être rebasculée vers master sans nouvelle exécution (revue adverse).
    branches: [master]

permissions:
  contents: read

concurrency:
  group: bee-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  TETE_SHA: ${{ github.event.pull_request.head.sha }}
  REGISTRE: Bee-ruche/registre
  # Version du juge commun : le commit que désignait l'étiquette juge-v1 du registre le 30/10/2026 (vérifié
  # par l'API GitHub). Épinglé par SHA, pas par l'étiquette : une étiquette se déplace, et une branche du
  # même nom la masquerait (revue adverse de miniz-0032). Le même SHA que dans le « uses: » du job juge (une
  # expression n'y est pas permise) ; bee/ci/test_verdict.py vérifie qu'ils sont égaux.
  JUGE_COMMUN_SHA: "821647d8fcb27840908b98f6778862bfb228aef2"  # juge-v1
  ETATS: ${{ github.workspace }}/etats
  # Amorçage : la première PR, qui apporte bee/, a pour base le master d'origine, sans juges.
  # Pour CE commit seulement, les juges viennent de la PR elle-même (verdict : amorcage: true).
  BEE_COMMIT_AMORCAGE: 2948eebafc5b9f1c69bebed80333e403a09bd62d
  # Logique de bee/ci/juges.sh (copie identique, vérifiée par bee/ci/test_verdict.py), exécutée par
  # l'étape « Juges » de chaque job : à l'amorçage, la base ne contient pas encore ce script.
  # Variables attendues : base, pr, base_sha, etats.
  BEE_JUGES: |
    mkdir -p "$etats"
    if [ -f "$base/bee/ci/etape.sh" ] && [ -f "$base/bee/juge/juge.py" ] && [ ! -e "$base/bee/juge/projet.py" ] && [ -f "$pr/bee/juge/projet.py" ]; then
      echo "::warning::INTRODUCTION DU GREFFON : la base $base_sha a l'ancien juge isolé et pas encore de greffon ; les juges restent ceux de la base (l'ancien juge isolé juge aussi la PR), le juge commun prend le greffon de la PR qui l'apporte (verdict.json : amorcage: true ; tâche d'outillage, relue par un gardien)."
      echo "pr" > "$etats/greffon.txt"
      echo "oui" > "$etats/amorcage.txt"
      echo "succes" > "$etats/juges.txt"
    elif [ -f "$base/bee/ci/etape.sh" ]; then
      echo "Juges : bee/ de la base de la PR ($base_sha), greffon du juge commun compris."
      echo "base" > "$etats/greffon.txt"
      echo "succes" > "$etats/juges.txt"
    elif [ "$base_sha" = "$BEE_COMMIT_AMORCAGE" ] && [ -f "$pr/bee/ci/etape.sh" ]; then
      echo "::warning::AMORÇAGE : la base $base_sha (commit d'amorçage épinglé) ne contient pas bee/ ; les juges viennent de la PR elle-même (verdict.json : amorcage: true)."
      rm -rf "$base/bee"
      cp -a "$pr/bee" "$base/bee"
      mkdir -p "$base/.github/workflows"
      cp -a "$pr/.github/workflows/bee-ci.yml" "$base/.github/workflows/bee-ci.yml"
      echo "pr" > "$etats/greffon.txt"
      echo "oui" > "$etats/amorcage.txt"
      echo "succes" > "$etats/juges.txt"
    else
      echo "echec" > "$etats/juges.txt"
      echo "::error::La base de la PR ($base_sha) ne contient pas bee/ : pas de juges, CI refusée (seul le commit d'amorçage $BEE_COMMIT_AMORCAGE est accepté sans juges)." >&2
      exit 1
    fi

  # Conteneur du juge commun (juge-commun/ : le registre au commit JUGE_COMMUN_SHA), après l'étape « Juges » :
  # isoler.sh du registre et l'image commune avec les paquets du greffon (de la base ; de la PR en amorçage).
  BEE_IMAGE: |
    greffon=base
    if [ "$(cat "$ETATS/greffon.txt")" = "pr" ]; then greffon=pr; fi
    image="$(python3 juge-commun/outils/juge/juge.py --outillage "$greffon" --image-seulement)"
    echo "ISOLER=$GITHUB_WORKSPACE/juge-commun/outils/juge/isoler.sh" >> "$GITHUB_ENV"
    echo "IMAGE=$image" >> "$GITHUB_ENV"
  # Copie de travail jetable pour une étape conteneurisée : la base et la PR, fraîches.
  BEE_TRAVAIL: |
    travail="$RUNNER_TEMP/travail-$1"
    rm -rf "$travail"
    mkdir -p "$travail"
    cp -a base "$travail/base"
    cp -a pr "$travail/pr"
    echo "$travail"

jobs:
  manifeste:
    name: Manifeste et taille
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tache: ${{ steps.manifeste.outputs.tache }}
      type: ${{ steps.manifeste.outputs.type }}
      metrique: ${{ steps.manifeste.outputs.metrique }}
      sortie_compressee: ${{ steps.manifeste.outputs.sortie_compressee }}
    steps:
      - name: Base de la PR (juges)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Tête de la PR (historique complet, pour le diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Registre Bee (branche main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: main
          path: registre
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dépendances de l'outil bee
        run: pip install -r registre/outils/requirements.txt
      - name: Tests unitaires de l'outillage de la base (ab.py, verdict.py)
        run: |
          python3 base/bee/bench/test_ab.py
          python3 base/bee/ci/test_verdict.py
          python3 base/bee/bench/test_profil.py
      - name: Manifeste, tâche, R1 et commandement 3
        id: manifeste
        env:
          AUTEUR: ${{ github.event.pull_request.user.login }}
          BEE_SORTIE_TACHE: ${{ github.workspace }}/donnees/tache.yaml
        run: |
          mkdir -p donnees
          base/bee/ci/etape.sh "$ETATS" manifeste_et_taille base/bee/ci/manifeste.sh pr registre python3
      - name: Conserver le manifeste, la tâche et l'état
        if: always()
        env:
          MANIFESTE: ${{ steps.manifeste.outputs.manifeste }}
        run: |
          mkdir -p donnees
          # Nom validé par bee/ci/manifeste.sh (manifestes/miniz-NNNN.yaml ou CONTRIBUTION.yaml).
          case "$MANIFESTE" in
            manifestes/miniz-[0-9][0-9][0-9][0-9].yaml|CONTRIBUTION.yaml) cp "pr/$MANIFESTE" donnees/CONTRIBUTION.yaml 2>/dev/null || true ;;
          esac
          cp -r "$ETATS" donnees/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-manifeste
          path: donnees/
          if-no-files-found: warn

  # Le commit que le juge commun extrait comme base : son bee/juge/projet.py est le greffon et ses sources
  # sont A. Toujours LE point de départ de la PR (un seul merge-base), dont bee/ et miniz* doivent être ceux
  # de la base : tout ce que le juge lit dans A. Sinon la CI est rouge (« rebasez »), car A ne serait pas ce
  # que la PR change dans master : comparer la base à une tête qui n'a pas ses changements, ou un point de
  # départ à une tête qui a recopié (squash, cherry-pick) ce que master a reçu depuis, attribuerait à la PR
  # le travail d'un autre (revues adverses de miniz-0032 : +19 % fabriqué, faux refus d'une PR non rebasée,
  # gain d'une optimisation recopiée, criss-cross). Jamais la PR, sauf pour la PR qui introduit le greffon
  # (bee/ci/juges.sh), qui ne touche pas miniz : ses sources sont alors exactement celles du point de départ.
  # Le commit retenu et la règle qui l'a choisi sont publiés dans verdict.json (base_juge).
  greffon:
    name: Greffon du juge commun
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_juge: ${{ steps.greffon.outputs.base_juge }}
      regle: ${{ steps.greffon.outputs.regle }}
      depart: ${{ steps.greffon.outputs.depart }}
    steps:
      - name: Base de la PR (juges)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Tête de la PR (historique complet, qui contient la base et le point de départ)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Commit du greffon et de A pour le juge commun
        id: greffon
        run: |
          echo "echec" > "$ETATS/greffon_juge.txt"
          departs="$(git -C pr merge-base --all "$BASE_SHA" "$TETE_SHA" || true)"
          if [ "$(printf '%s\n' "$departs" | grep -c .)" -ne 1 ]; then
            echo "regle=refus_point_de_depart" >> "$GITHUB_OUTPUT"
            echo "::error::Cette PR n'a pas un seul point de départ sur master (merge-base --all : $(printf '%s ' $departs)) : rebasez-la sur master ($BASE_SHA)." >&2
            exit 1
          fi
          depart="$departs"
          echo "depart=$depart" >> "$GITHUB_OUTPUT"
          if ! git -C pr diff --quiet "$depart" "$BASE_SHA" -- bee 'miniz*'; then
            echo "regle=refus_rebase" >> "$GITHUB_OUTPUT"
            echo "::error::bee/ ou miniz a changé sur master depuis le point de départ de cette PR ($depart) : rebasez-la sur master ($BASE_SHA). Le juge commun ne mesure une PR que contre ce qu'elle change dans master." >&2
            exit 1
          fi
          if [ "$(cat "$ETATS/greffon.txt")" = "pr" ]; then
            if ! git -C pr diff --quiet "$depart" "$TETE_SHA" -- 'miniz*'; then
              echo "regle=refus_introduction_miniz" >> "$GITHUB_OUTPUT"
              echo "::error::Introduction du greffon : la PR qui apporte bee/juge/projet.py ne doit pas modifier miniz (le juge commun prend ses sources comme A)." >&2
              exit 1
            fi
            base_juge="$TETE_SHA"
            regle=introduction
          else
            base_juge="$depart"
            regle=point_de_depart
          fi
          echo "Juge commun : greffon et A lus à $base_juge, règle $regle (base $BASE_SHA, point de départ $depart, tête $TETE_SHA)."
          echo "base_juge=$base_juge" >> "$GITHUB_OUTPUT"
          echo "regle=$regle" >> "$GITHUB_OUTPUT"
          echo "succes" > "$ETATS/greffon_juge.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-greffon
          path: etats/
          if-no-files-found: warn

  compilation-et-tests:
    name: Compilation et tests (${{ matrix.arch }})
    needs: manifeste
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            machine: ubuntu-24.04
          - arch: arm64
            machine: ubuntu-24.04-arm
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 30
    steps:
      - name: Base de la PR (juges ; historique complet pour le corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Juge commun (registre, au commit épinglé de juge-v1)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_COMMUN_SHA }}
          path: juge-commun
          persist-credentials: false
      - name: Image du conteneur du juge commun (réseau pour docker build, avant d'exécuter quoi que ce soit de la PR)
        run: eval "$BEE_IMAGE"
      - name: Compilation et tests d'origine de miniz (conteneur sans réseau)
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- compilation)"
          base/bee/ci/etape.sh "$ETATS" compilation_${{ matrix.arch }} "$ISOLER" "$IMAGE" "$travail" -- \
            /travail/base/bee/ci/tests_origine.sh /travail/pr /travail/cmake
      - name: Tests différentiels et empreintes (conteneur sans réseau)
        if: always()
        env:
          SORTIE_COMPRESSEE: ${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- differentiel)"
          base/bee/ci/etape.sh "$ETATS" differentiel_${{ matrix.arch }} "$ISOLER" "$IMAGE" "$travail" -- \
            env SORTIE_COMPRESSEE="$SORTIE_COMPRESSEE" BASE_SHA="$BASE_SHA" TETE_SHA="$TETE_SHA" \
            /travail/base/bee/ci/differentiel.sh /travail/pr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-tests-${{ matrix.arch }}
          path: etats/
          if-no-files-found: warn

  fuzzing:
    name: Fuzzing 10 minutes (x86-64)
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Base de la PR (harnais ; historique complet pour le corpus de graines)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Juge commun (registre, au commit épinglé de juge-v1)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_COMMUN_SHA }}
          path: juge-commun
          persist-credentials: false
      - name: Image du conteneur du juge commun (réseau pour docker build, avant d'exécuter quoi que ce soit de la PR)
        run: eval "$BEE_IMAGE"
      # Les entrées fautives, les journaux de libFuzzer et les traces ne quittent JAMAIS la machine de
      # CI : journaux et artefacts d'un dépôt public sont publics (docs/securite.md du registre).
      # lancer.sh est en mode discret sous GitHub Actions (empreintes seulement) et rejoue chaque
      # entrée fautive sur la base : un écart qui y existe déjà est signalé sans compter contre la PR.
      - name: Fuzzing différentiel, 2 harnais en parallèle, 600 s chacun (conteneur sans réseau)
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- fuzzing)"
          base/bee/ci/etape.sh "$ETATS" fuzzing "$ISOLER" "$IMAGE" "$travail" -- \
            env CLANG=clang-18 BEE_FUZZ_SORTIES=/travail/sorties-fuzz BEE_FUZZ_DISCRET=1 GITHUB_ACTIONS=true \
            /travail/base/bee/fuzz/lancer.sh 600 --source /travail/pr --reference /travail/base
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-fuzzing
          path: etats/
          if-no-files-found: warn

  # Juge commun du registre, juge.yml de juge-v1 épinglé par SHA : il juge la tête contre A avec le greffon
  # de needs.greffon (la base), et publie l'artefact « juge » (juge.json, code). Le job ne devient jamais
  # rouge à cause de B : c'est verdict.py qui lit le code (0 juste, 1 refusé, 2 environnement). Limite : à
  # ce commit, juge.yml extrait lui-même le code du juge commun à l'étiquette juge-v1 (JUGE_COMMUN_REF du
  # registre) et la base sans historique ; ces deux points se corrigent dans le registre. Réseau sur l'hôte :
  # outre l'image, le greffon fait un git fetch d'un SHA fixe (2948eeb, corpus) après l'extraction de la PR.
  juge:
    name: Juge commun
    needs: [manifeste, greffon]
    if: always() && needs.greffon.result == 'success' && needs.greffon.outputs.base_juge != ''
    uses: Bee-ruche/registre/.github/workflows/juge.yml@821647d8fcb27840908b98f6778862bfb228aef2 # juge-v1
    with:
      base_sha: ${{ needs.greffon.outputs.base_juge }}
      tete_sha: ${{ github.event.pull_request.head.sha }}
      options: sortie_compressee=${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}

  # Transition : tant que la base a encore l'ancien juge isolé (bee/juge/juge.py, version 2), il juge aussi
  # la PR, comme avant. C'est le cas de toute PR vers master tant que miniz-0032 n'y est pas fusionnée ;
  # ensuite master n'en a plus et ce job ne fait rien.
  juge-ancien:
    name: Ancien juge isolé de la base (transition)
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Base de la PR (juge ; historique complet pour le corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR (historique complet, qui contient le point de départ et la tête)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Ancien juge isolé de la base, s'il y est encore — A = point de départ de la PR, B = tête
        env:
          SORTIE_COMPRESSEE: ${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}
        run: |
          mkdir -p conserver
          if [ ! -f base/bee/juge/juge.py ]; then
            echo "La base n'a plus d'ancien juge isolé (bee/juge/juge.py) : le juge commun juge seul."
            echo "succes" > "$ETATS/juge_ancien.txt"
            exit 0
          fi
          python3 base/bee/juge/juge.py --image-seulement --outillage base
          depart="$(git -C pr merge-base "$BASE_SHA" "$TETE_SHA")"
          echo "A = point de départ de la PR $depart (base $BASE_SHA), B = tête $TETE_SHA"
          git -C pr worktree add --detach "$RUNNER_TEMP/source-a" "$depart"
          git -C pr worktree add --detach "$RUNNER_TEMP/source-b" "$TETE_SHA"
          base/bee/ci/etape.sh "$ETATS" juge_ancien \
            python3 base/bee/juge/juge.py --outillage base \
              --source-a "$RUNNER_TEMP/source-a" --source-b "$RUNNER_TEMP/source-b" \
              --sortie-compressee "$SORTIE_COMPRESSEE" --repetitions 10 \
              --depot-diff pr --base "$depart" --tete "$TETE_SHA" --json "$GITHUB_WORKSPACE/conserver/juge-ancien.json"
      - name: Conserver l'état
        if: always()
        run: |
          mkdir -p conserver
          cp -r "$ETATS" conserver/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-juge-ancien
          path: conserver/
          if-no-files-found: warn

  # Exécute du code de la PR (bee/juge/test_juge.py) sur la machine de CI quand elle modifie bee/juge/ ou ce
  # workflow : job à part, en lecture seule, sans secret ni identifiant conservé, sans artefact ni sortie.
  # Seul son résultat compte (needs du verdict) : verdict.json reste assemblé par l'outillage de la base.
  meta-juge:
    name: Méta-tests du greffon (juge commun)
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Base de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR (historique complet, pour le diff et le corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Juge commun (registre, au commit épinglé de juge-v1)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_COMMUN_SHA }}
          path: juge-commun
          persist-credentials: false
      # Une PR qui modifie bee/juge/ (greffon, harnais) ou la version du juge commun doit prouver que le juge
      # commun, avec SON greffon, attrape des variantes malveillantes de miniz (bee/juge/test_juge.py),
      # compilées et lancées en conteneur.
      - name: Méta-tests (seulement si la PR modifie bee/juge/ ou ce workflow)
        run: |
          if git -C pr diff --quiet "$BASE_SHA...$TETE_SHA" -- bee/juge .github/workflows/bee-ci.yml; then
            echo "bee/juge/ et bee-ci.yml inchangés par la PR : pas de méta-tests."
            mkdir -p "$ETATS" && echo "succes" > "$ETATS/meta_juge.txt"
            exit 0
          fi
          base/bee/ci/etape.sh "$ETATS" meta_juge env BEE_JUGE_INTEGRATION=1 PYTHONDONTWRITEBYTECODE=1 \
            BEE_JUGE_COMMUN="$GITHUB_WORKSPACE/juge-commun/outils/juge" python3 pr/bee/juge/test_juge.py
      # Pas d'artefact : le code de la PR a tourné dans ce job, rien de ce qu'il a pu écrire n'atteint le verdict.

  # Tests de l'outillage de CI de la PR (bee/ci/test_verdict.py) quand elle modifie bee/ci/ ou ce workflow : le
  # job manifeste ne lance que ceux de la base. Mêmes conditions que meta-juge : code de la PR sur la machine
  # de CI, donc job à part, en lecture seule, sans secret ni identifiant conservé, sans artefact ni sortie ;
  # seul son résultat compte, et verdict.json reste assemblé par l'outillage de la base.
  outillage-pr:
    name: Tests de l'outillage de CI de la PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Tête de la PR (historique complet, pour le diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PyYAML (lecture du workflow par les tests)
        run: pip install "pyyaml==6.0.2"
      - name: Tests de l'outillage de CI de la PR (seulement si la PR modifie bee/ci/ ou ce workflow)
        run: |
          if git -C pr diff --quiet "$BASE_SHA...$TETE_SHA" -- bee/ci .github/workflows/bee-ci.yml; then
            echo "bee/ci/ et bee-ci.yml inchangés par la PR : les tests de la base suffisent (job manifeste)."
            exit 0
          fi
          python3 pr/bee/ci/test_verdict.py

  verdict:
    name: Verdict
    needs: [manifeste, greffon, compilation-et-tests, fuzzing, juge, juge-ancien, meta-juge, outillage-pr]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Base de la PR (verdict.py)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Historique de la PR (lu par git diff seulement, pour compter les lignes)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        id: juges
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PyYAML (lecture du manifeste et de la tâche)
        run: pip install "pyyaml==6.0.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: etat-*
          path: artefacts
      - name: Rapport du juge commun (artefact « juge » ; absent si le juge n'a pas tourné)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: juge
          path: artefacts/juge
      - name: Assembler verdict.json
        env:
          RESULTATS_JOBS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTATS_JOBS" > resultats-jobs.json
          verdict=base/bee/ci/verdict.py
          if [ "$(cat "$ETATS/greffon.txt")" = "pr" ]; then
            # Même règle que pour le greffon : seule la PR qui l'introduit apporte l'assembleur qui le connaît.
            echo "::warning::La base n'a pas encore de greffon : l'assembleur du verdict de la PR est utilisé (amorçage ; tâche d'outillage, relecture d'un gardien exigée par le registre)."
            verdict=pr/bee/ci/verdict.py
          fi
          python3 "$verdict" --artefacts artefacts --juge artefacts/juge --etats "$ETATS" --jobs resultats-jobs.json \
            --depot pr --base "$BASE_SHA" --tete "$TETE_SHA" --sortie verdict.json
          cat verdict.json
      - name: Verdict de repli (base sans juges, verdict.py indisponible)
        if: failure() && steps.juges.outcome == 'failure'
        run: |
          printf '%s\n' '{"ci": "rouge", "etape_en_echec": "Juges (base sans bee/)", "gain": null, "metrique": null, "au_dela_du_bruit": false, "mesures": {"A": {}, "B": {}}, "instructions": null, "degradations": {}, "lignes_modifiees": null, "amorcage": false}' > verdict.json
          cat verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verdict
          path: verdict.json
          if-no-files-found: error
      - name: CI rouge si une étape a échoué
        run: |
          python3 -c 'import json, sys; v = json.load(open("verdict.json")); print("CI", v["ci"], v.get("etape_en_echec", "")); sys.exit(v["ci"] != "verte")'
