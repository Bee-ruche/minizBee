# Bee CI of the miniz fork (https://github.com/Bee-ruche/minizBee). Independent fork, not affiliated with the miniz project.
#
# Steps, in order (the first failed one is reported, see the Bee registry's docs/evaluation.md):
#   1. manifest and size: bee check-fork, with the registry's tool (branch main, read in English; its metric ids in
#      French or in English until ruche-0149: bee/ci/vocabulaire.py)
#   2. miniz's build and original tests, x86-64 and ARM64
#   3. differential tests against zlib and determinism fingerprints, x86-64 and ARM64
#   4. libFuzzer fuzzing, 2 harnesses in parallel for 10 minutes, x86-64
#   5. the registry's common judge (reusable workflow judge.yml of judge-v4, pinned by SHA) with minizBee's plugin
#      (bee/judge/project.py) read in the BASE: the PR's base (the event's) against the PR's head; every output
#      checked by the host (the host's zlib, inputs drawn
#      at random), interleaved measurements (10 repetitions) and Cachegrind instruction count, all in
#      containers; analysis of the compiled objects (suspicious constructs). The verdict job checks the judge's
#      report against its job's outputs (report.py --verify). Transition: a base that still pins juge-v3 (the PR
#      that adopts judge-v4, miniz-0050) is judged by juge-v3 too, whose report its verdict.py reads
#   6. the plugin's meta-tests against the common judge, only if the PR modifies bee/judge/ or this workflow
#   7. verdict.json, published as the artifact « verdict » (read by the registry's verdicts.yml workflow)
#
# Security:
#   - permissions: contents: read for the whole workflow; no secret; checkouts keep no credentials
#     (persist-credentials: false). Trigger pull_request (never pull_request_target):
#     for a PR from a fork, GitHub provides neither secret nor write token anyway.
#   - the judges (tests, corpus, bench, fuzzing, CI scripts) come from the PR's BASE; only the
#     sources of miniz come from the PR, which cannot loosen those files.
#   - BUT this workflow file is the PR's (pull_request trigger): a PR that modifies
#     .github/ or bee/ can fabricate its own verdict. The registry detects it on its side (the list of the
#     PR's files read from the GitHub API, verdicts.yml): verdict refused for an optimization,
#     review by the council or a Confirmed member required for a tooling task (R3).
#   - the manifest (manifests/<task>.yaml or manifestes/) and the registry's task are data (yaml.safe_load), never run;
#     the values drawn from them are checked against closed lists.
#   - « ci » is decided by the verdict job from the jobs' results (needs.*.result), which the PR's
#     code cannot rewrite; the state files only name the failed step.
#   - the PR's C code NEVER runs on the CI machine itself: build, tests,
#     fuzzing and measurements run in the common judge's container (no network, read-only, no
#     privilege), on disposable copies. isoler.sh and the image come from the registry at the commit JUGE_COMMUN_SHA;
#     judge.yml is called at that commit and checks out the judge itself (ruche-0024: never a tag).
#     The image is built before the slightest file of the PR is mounted. The corpus commit
#     (2948eeb) is declared to judge.yml (history) and fetched before the PR; no network afterwards.
#   - the plugin (bee/judge/project.py) is read in the BASE, never in the PR.
#   - steps 2 to 4 remain checks « from the inside »: malicious code can distort its
#     own tests (exit(0) in the middle, for example) but not get out. The common judge (step 5), for its part,
#     checks the outputs from the outside, with inputs no code knows in advance, and measures
#     the times through the kernel: it is authoritative. Threat model: bee/README.md, section « Common judge and plugin ».
name: bee-ci

on:
  pull_request:
    # Only PRs to master are judged: a PR to an old branch would be judged by that branch's judges, then could be
    # switched to master without a new run (adversarial review).
    branches: [master]

permissions:
  contents: read

concurrency:
  group: bee-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  TETE_SHA: ${{ github.event.pull_request.head.sha }}
  REGISTRE: Bee-ruche/registre
  # The common judge's version: judge-v4, the registry's commit the founder tags judge-v4 (ruche-0148, merge of PR #348,
  # 11/11/2026; judge.yml itself refuses a commit that is not on the registry's main branch). Pinned by SHA, not by the tag: a tag moves, and a branch of the
  # same name would hide it (adversarial review of miniz-0032). The same SHA as in the « uses: » of the judge job (an
  # expression is not allowed there); bee/ci/test_verdict.py checks that they are equal.
  JUGE_COMMUN_SHA: "7623c1288482673f48171bb7ed921f447ac272d9"  # judge-v4
  # The previous version, juge-v3 (PR #184, 2/11/2026), for the transition only: the juge-v3 job judges a
  # PR whose base pins it (the base's verdict.py reads juge-v3's report). The same SHA as in that job's « uses: ».
  JUGE_V3_SHA: "3b21e97a89c25ddcfbb3c0d28d1086b801c991bc"  # juge-v3
  ETATS: ${{ github.workspace }}/etats
  # Bootstrap: the first PR, which brings bee/, has the original master as its base, without judges.
  # For THIS commit only, the judges come from the PR itself (verdict: bootstrap: true).
  BEE_COMMIT_AMORCAGE: 2948eebafc5b9f1c69bebed80333e403a09bd62d
  # The logic of bee/ci/juges.sh (an identical copy, checked by bee/ci/test_verdict.py), run by
  # the « Judges » step of each job: at bootstrap, the base does not contain this script yet. It writes the state
  # values the base's bee/ci/verdict.py reads (succes, echec, oui). Expected variables: base, pr, base_sha, etats.
  BEE_JUGES: |
    mkdir -p "$etats"
    if [ -f "$base/bee/ci/etape.sh" ]; then
      echo "Judges: bee/ of the PR's base ($base_sha), the common judge's plugin included."
      echo "base" > "$etats/greffon.txt"
      echo "succes" > "$etats/juges.txt"
    elif [ "$base_sha" = "$BEE_COMMIT_AMORCAGE" ] && [ -f "$pr/bee/ci/etape.sh" ]; then
      echo "::warning::BOOTSTRAP: the base $base_sha (pinned bootstrap commit) does not contain bee/; the judges come from the PR itself (verdict.json: bootstrap: true)."
      rm -rf "$base/bee"
      cp -a "$pr/bee" "$base/bee"
      mkdir -p "$base/.github/workflows"
      cp -a "$pr/.github/workflows/bee-ci.yml" "$base/.github/workflows/bee-ci.yml"
      echo "pr" > "$etats/greffon.txt"
      echo "oui" > "$etats/amorcage.txt"
      echo "succes" > "$etats/juges.txt"
    else
      echo "echec" > "$etats/juges.txt"
      echo "::error::The PR's base ($base_sha) does not contain bee/: no judges, CI refused (only the bootstrap commit $BEE_COMMIT_AMORCAGE is accepted without judges)." >&2
      exit 1
    fi

  # The common judge's container (juge-commun/: the registry at the commit JUGE_COMMUN_SHA), after the « Judges » step:
  # the registry's isoler.sh and the common image with the plugin's packages (from the base; from the PR at bootstrap).
  # judge-v4's commit has tools/judge/isoler.sh without its executable mode (lost when the judge moved to tools/judge).
  BEE_IMAGE: |
    chmod +x juge-commun/tools/judge/isoler.sh
    greffon=base
    if [ "$(cat "$ETATS/greffon.txt")" = "pr" ]; then greffon=pr; fi
    image="$(python3 juge-commun/tools/judge/judge.py --tooling "$greffon" --image-only)"
    echo "ISOLER=$GITHUB_WORKSPACE/juge-commun/tools/judge/isoler.sh" >> "$GITHUB_ENV"
    echo "IMAGE=$image" >> "$GITHUB_ENV"
  # A disposable working copy for a containerized step: the base and the PR, fresh.
  BEE_TRAVAIL: |
    travail="$RUNNER_TEMP/travail-$1"
    rm -rf "$travail"
    mkdir -p "$travail"
    cp -a base "$travail/base"
    cp -a pr "$travail/pr"
    echo "$travail"

jobs:
  manifeste:
    name: Manifest and size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tache: ${{ steps.manifeste.outputs.tache }}
      type: ${{ steps.manifeste.outputs.type }}
      metrique: ${{ steps.manifeste.outputs.metrique }}
      sortie_compressee: ${{ steps.manifeste.outputs.sortie_compressee }}
    steps:
      - name: Base of the PR (judges)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Head of the PR (full history, for the diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Bee registry (branch main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: main
          path: registre
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dependencies of the bee tool (the registry's tools/requirements.txt)
        run: pip install -r registre/tools/requirements.txt
      - name: Unit tests of the base's tooling (ab.py, verdict.py)
        run: |
          python3 base/bee/bench/test_ab.py
          python3 base/bee/ci/test_verdict.py
          python3 base/bee/bench/test_profil.py
      - name: Manifest, task, R1 and commandment 3
        id: manifeste
        env:
          AUTEUR: ${{ github.event.pull_request.user.login }}
          BEE_SORTIE_TACHE: ${{ github.workspace }}/donnees/tache.yaml
        run: |
          mkdir -p donnees
          base/bee/ci/etape.sh "$ETATS" manifeste_et_taille base/bee/ci/manifeste.sh pr registre python3
      - name: Keep the manifest, the task and the state
        if: always()
        env:
          MANIFESTE: ${{ steps.manifeste.outputs.manifeste }}
        run: |
          mkdir -p donnees
          # A name checked by bee/ci/manifeste.sh (manifests/ or manifestes/miniz-NNNN.yaml, or CONTRIBUTION.yaml);
          # a manifest is a regular file: neither a symbolic link nor a folder is copied.
          case "$MANIFESTE" in
            manifests/miniz-[0-9][0-9][0-9][0-9].yaml|manifestes/miniz-[0-9][0-9][0-9][0-9].yaml|CONTRIBUTION.yaml)
              if [ -f "pr/$MANIFESTE" ] && [ ! -L "pr/$MANIFESTE" ]; then cp "pr/$MANIFESTE" donnees/CONTRIBUTION.yaml 2>/dev/null || true; fi ;;
          esac
          cp -r "$ETATS" donnees/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-manifeste
          path: donnees/
          if-no-files-found: warn

  # The commit the common judge checks out as its base: its plugin is the plugin and its sources are A. Since juge-v3
  # (miniz-0048), judge.yml judges only the event's base: A is the PR's base (rule base_de_la_pr), provided the PR has
  # one starting point (one merge-base) whose bee/ and miniz* are the base's: everything the judge reads in A. Otherwise
  # the CI is red (« rebase »), because A would not be what the PR changes in master: comparing the base with a head
  # that does not have its changes, or a starting point with a head that has copied (squash, cherry-pick) what master
  # has received since, would credit the PR with someone else's work (adversarial reviews of miniz-0032: +19%
  # fabricated, false refusal of a PR not rebased, gain of a copied optimization, criss-cross). Never the PR.
  # The commit kept and the rule that chose it are published in verdict.json (judge_base); the outputs keep the
  # names and values the base's verdict.py reads (regle: base_de_la_pr…). « contrat » names the judge the base pins.
  greffon:
    name: Common judge plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_juge: ${{ steps.greffon.outputs.base_juge }}
      regle: ${{ steps.greffon.outputs.regle }}
      depart: ${{ steps.greffon.outputs.depart }}
      contrat: ${{ steps.greffon.outputs.contrat }}
    steps:
      - name: Base of the PR (judges)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Head of the PR (full history, which holds the base and the starting point)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Commit of the plugin and of A for the common judge
        id: greffon
        run: |
          echo "echec" > "$ETATS/greffon_juge.txt"
          departs="$(git -C pr merge-base --all "$BASE_SHA" "$TETE_SHA" || true)"
          if [ "$(printf '%s\n' "$departs" | grep -c .)" -ne 1 ]; then
            echo "regle=refus_point_de_depart" >> "$GITHUB_OUTPUT"
            echo "::error::This PR does not have a single starting point on master (merge-base --all: $(printf '%s ' $departs)): rebase it on master ($BASE_SHA)." >&2
            exit 1
          fi
          depart="$departs"
          echo "depart=$depart" >> "$GITHUB_OUTPUT"
          if ! git -C pr diff --quiet "$depart" "$BASE_SHA" -- bee 'miniz*'; then
            echo "regle=refus_rebase" >> "$GITHUB_OUTPUT"
            echo "::error::bee/ or miniz has changed on master since this PR's starting point ($depart): rebase it on master ($BASE_SHA). The common judge measures a PR only against what it changes in master." >&2
            exit 1
          fi
          # The judge the base's plugin and harness are written for: the one the base's bee-ci.yml pins (they change
          # together, in one PR, whose meta-tests run its plugin against its pin). Both judge the event's base.
          epingle="$(sed -n 's/^  JUGE_COMMUN_SHA: "\([0-9a-f]\{40\}\)".*/\1/p' base/.github/workflows/bee-ci.yml)"
          if [ "$(cat "$ETATS/greffon.txt")" != "base" ]; then
            echo "::error::The common judge reads the plugin of the PR's base only, and this base has none (bootstrap)." >&2
            exit 1
          fi
          case "$epingle" in
            "$JUGE_COMMUN_SHA") echo "contrat=judge-v4" >> "$GITHUB_OUTPUT" ;;
            "$JUGE_V3_SHA") echo "contrat=juge-v3" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::The base pins neither judge-v4 nor juge-v3 (${epingle:-no JUGE_COMMUN_SHA}): no common judge for its plugin." >&2
               exit 1 ;;
          esac
          base_juge="$BASE_SHA"
          regle=base_de_la_pr
          echo "Common judge: plugin and A read at $base_juge, rule $regle (base $BASE_SHA, starting point $depart, head $TETE_SHA)."
          echo "base_juge=$base_juge" >> "$GITHUB_OUTPUT"
          echo "regle=$regle" >> "$GITHUB_OUTPUT"
          echo "succes" > "$ETATS/greffon_juge.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-greffon
          path: etats/
          if-no-files-found: warn

  compilation-et-tests:
    name: Build and tests (${{ matrix.arch }})
    needs: manifeste
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            machine: ubuntu-24.04
          - arch: arm64
            machine: ubuntu-24.04-arm
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 30
    steps:
      - name: Base of the PR (judges; full history for the corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Head of the PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Common judge (registry, at the pinned commit of judge-v4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_COMMUN_SHA }}
          path: juge-commun
          persist-credentials: false
      - name: The common judge's container image (network for docker build, before running anything of the PR)
        run: eval "$BEE_IMAGE"
      - name: miniz's build and original tests (container without network)
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- compilation)"
          base/bee/ci/etape.sh "$ETATS" compilation_${{ matrix.arch }} "$ISOLER" "$IMAGE" "$travail" -- \
            /travail/base/bee/ci/tests_origine.sh /travail/pr /travail/cmake
      - name: Differential tests and fingerprints (container without network)
        if: always()
        env:
          SORTIE_COMPRESSEE: ${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- differentiel)"
          base/bee/ci/etape.sh "$ETATS" differentiel_${{ matrix.arch }} "$ISOLER" "$IMAGE" "$travail" -- \
            env SORTIE_COMPRESSEE="$SORTIE_COMPRESSEE" BASE_SHA="$BASE_SHA" TETE_SHA="$TETE_SHA" \
            /travail/base/bee/ci/differentiel.sh /travail/pr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-tests-${{ matrix.arch }}
          path: etats/
          if-no-files-found: warn

  fuzzing:
    name: Fuzzing 10 minutes (x86-64)
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Base of the PR (harnesses; full history for the seed corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Head of the PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Common judge (registry, at the pinned commit of judge-v4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_COMMUN_SHA }}
          path: juge-commun
          persist-credentials: false
      - name: The common judge's container image (network for docker build, before running anything of the PR)
        run: eval "$BEE_IMAGE"
      # The faulty inputs, libFuzzer's logs and the traces NEVER leave the CI machine: the logs and artifacts of a
      # public repository are public (the registry's docs/security.md). lancer.sh is in discreet mode under GitHub
      # Actions (fingerprints only) and replays each faulty input on the base: a discrepancy that already exists there
      # is reported without counting against the PR.
      - name: Differential fuzzing, 2 harnesses in parallel, 600 s each (container without network)
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- fuzzing)"
          base/bee/ci/etape.sh "$ETATS" fuzzing "$ISOLER" "$IMAGE" "$travail" -- \
            env CLANG=clang-18 BEE_FUZZ_SORTIES=/travail/sorties-fuzz BEE_FUZZ_DISCRET=1 GITHUB_ACTIONS=true \
            /travail/base/bee/fuzz/lancer.sh 600 --source /travail/pr --reference /travail/base
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-fuzzing
          path: etats/
          if-no-files-found: warn

  # The registry's common judge, judge.yml of judge-v4 pinned by SHA: it judges the PR's head against its base, the
  # event's (judge.yml compares them with github.event.pull_request), with the base's plugin, and publishes the artifact
  # « judge » (judge.json, code, log.txt, outputs) and, as job outputs, the report's SHA-256 and key figures, which the
  # verdict job checks (report.py --verify). The job never turns red because of B: verdict.py reads the code (0 correct,
  # 1 refused, 2 environment). History: the corpus commit (2948eeb), which judge.yml checks in the base's ancestry and
  # fetches before the PR. judge-v4 also reads the French plugin (bee/juge/projet.py): it judges a base that pins juge-v3 too.
  judge:
    name: Common judge
    needs: [manifeste, greffon]
    if: always() && needs.greffon.result == 'success'
    uses: Bee-ruche/registre/.github/workflows/judge.yml@7623c1288482673f48171bb7ed921f447ac272d9 # judge-v4
    with:
      history: 2948eebafc5b9f1c69bebed80333e403a09bd62d
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      options: sortie_compressee=${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}

  # Transition to judge-v4: a base that still pins juge-v3 (the PR that adopts judge-v4, miniz-0050) is judged by the old
  # version and by the new one. Its verdict.py reads juge-v3's artifact « juge »; the verdict job reads this job as « juge ».
  juge-v3:
    name: Common judge, juge-v3 (transition)
    needs: [manifeste, greffon]
    if: always() && needs.greffon.result == 'success' && needs.greffon.outputs.contrat == 'juge-v3'
    uses: Bee-ruche/registre/.github/workflows/juge.yml@3b21e97a89c25ddcfbb3c0d28d1086b801c991bc # juge-v3
    with:
      historique: 2948eebafc5b9f1c69bebed80333e403a09bd62d
      base_sha: ${{ github.event.pull_request.base.sha }}
      tete_sha: ${{ github.event.pull_request.head.sha }}
      options: sortie_compressee=${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}

  # Transition to judge-v4: a base's verdict.py written for juge-v3 still requires the step of the old isolated judge
  # (bee/juge/juge.py, gone since miniz-0032). Under juge-v3 only, this job records that the base has none.
  juge-ancien:
    name: Old isolated judge of the base (juge-v3 transition)
    needs: [manifeste, greffon]
    if: always() && needs.greffon.outputs.contrat == 'juge-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Base of the PR (judges)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: The base has no old isolated judge (bee/juge/juge.py)
        run: |
          if [ -e base/bee/juge/juge.py ]; then
            echo "::error::The base still has the old isolated judge (bee/juge/juge.py), which this workflow no longer runs." >&2
            exit 1
          fi
          echo "succes" > "$ETATS/juge_ancien.txt"
      - name: Keep the state
        if: always()
        run: |
          mkdir -p conserver
          cp -r "$ETATS" conserver/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-juge-ancien
          path: conserver/
          if-no-files-found: warn

  # Runs the PR's code (bee/judge/test_judge.py) on the CI machine when it modifies bee/judge/ or this
  # workflow: a separate job, read-only, with no secret nor kept credential, no artifact nor output.
  # Only its result counts (needs of the verdict): verdict.json stays assembled by the base's tooling.
  meta-juge:
    name: Plugin meta-tests (common judge)
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Base of the PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Head of the PR (full history, for the diff and the corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Common judge (registry, at the pinned commit of judge-v4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_COMMUN_SHA }}
          path: juge-commun
          persist-credentials: false
      # A PR that modifies bee/judge/ (plugin, harness) or the common judge's version must prove that the common
      # judge, with ITS plugin, catches malicious variants of miniz (bee/judge/test_judge.py),
      # compiled and run in containers.
      - name: Meta-tests (only if the PR modifies bee/judge/ or this workflow)
        run: |
          if git -C pr diff --quiet "$BASE_SHA...$TETE_SHA" -- bee/judge bee/juge .github/workflows/bee-ci.yml; then
            echo "bee/judge/ and bee-ci.yml unchanged by the PR: no meta-tests."
            mkdir -p "$ETATS" && echo "succes" > "$ETATS/meta_juge.txt"
            exit 0
          fi
          base/bee/ci/etape.sh "$ETATS" meta_juge env BEE_JUDGE_INTEGRATION=1 PYTHONDONTWRITEBYTECODE=1 \
            BEE_COMMON_JUDGE="$GITHUB_WORKSPACE/juge-commun/tools/judge" python3 pr/bee/judge/test_judge.py
      # No artifact: the PR's code ran in this job, nothing it may have written reaches the verdict.

  # Tests of the PR's CI tooling (bee/ci/test_verdict.py) when it modifies bee/ci/ or this workflow: the
  # manifeste job runs only the base's. The same conditions as meta-juge: the PR's code on the CI machine,
  # hence a separate job, read-only, with no secret nor kept credential, no artifact nor output;
  # only its result counts, and verdict.json stays assembled by the base's tooling.
  outillage-pr:
    name: Tests of the PR's CI tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Head of the PR (full history, for the diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PyYAML (the tests read the workflow)
        run: pip install "pyyaml==6.0.2"
      - name: Tests of the PR's CI tooling (only if the PR modifies bee/ci/ or this workflow)
        run: |
          if git -C pr diff --quiet "$BASE_SHA...$TETE_SHA" -- bee/ci .github/workflows/bee-ci.yml; then
            echo "bee/ci/ and bee-ci.yml unchanged by the PR: the base's tests are enough (manifeste job)."
            exit 0
          fi
          python3 pr/bee/ci/test_verdict.py

  verdict:
    name: Verdict
    needs: [manifeste, greffon, compilation-et-tests, fuzzing, judge, juge-v3, juge-ancien, meta-juge, outillage-pr]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Base of the PR (verdict.py)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: History of the PR (read by git diff only, to count the lines)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        id: juges
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PyYAML (reading the manifest and the task)
        run: pip install "pyyaml==6.0.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: etat-*
          path: artefacts
      - name: The common judge's report (artifact « judge »; missing if the judge did not run)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: judge
          path: artefacts/judge
      - name: juge-v3's report (artifact « juge », transition; missing if it did not run)
        if: needs.greffon.outputs.contrat == 'juge-v3'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: juge
          path: artefacts/juge
      - name: Common judge (registry, at the pinned commit of judge-v4; report.py)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_COMMUN_SHA }}
          path: juge-commun
          persist-credentials: false
      - name: Common judge, juge-v3 (registry, at its pinned commit; rapport.py, transition)
        if: needs.greffon.outputs.contrat == 'juge-v3'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: ${{ env.JUGE_V3_SHA }}
          path: juge-v3
          persist-credentials: false
      # The report read here must be the one the judging job published (SHA-256 and key figures, its job outputs), with
      # code 0 and the PR's base and head; otherwise the judge's step fails (juge_isole: echec). Under the juge-v3
      # transition, both judges' reports are checked.
      - name: Common judge's report checked against its job's outputs (report.py --verify)
        env:
          SORTIES_JUGE: ${{ toJSON(needs.judge.outputs) }}
        run: |
          printf '%s' "$SORTIES_JUGE" > sorties-judge.json
          if ! python3 juge-commun/tools/judge/report.py artefacts/judge/judge.json --verify sorties-judge.json --base "$BASE_SHA" --head "$TETE_SHA"; then
            echo "echec" > "$ETATS/juge_isole.txt"
            echo "::error::The common judge's report is not the one its job published, or its code is not 0, or it names other commits than the PR's: the judge's step fails." >&2
          fi
      - name: juge-v3's report checked against its job's outputs (rapport.py --verifier, transition)
        if: needs.greffon.outputs.contrat == 'juge-v3'
        env:
          SORTIES_JUGE: ${{ toJSON(needs.juge-v3.outputs) }}
        run: |
          printf '%s' "$SORTIES_JUGE" > sorties-juge.json
          if ! python3 juge-v3/outils/juge/rapport.py artefacts/juge/juge.json --verifier sorties-juge.json --base "$BASE_SHA" --tete "$TETE_SHA"; then
            echo "echec" > "$ETATS/juge_isole.txt"
            echo "::error::juge-v3's report is not the one its job published, or its code is not 0, or it names other commits than the PR's: the judge's step fails." >&2
          fi
      - name: Assemble verdict.json
        env:
          RESULTATS_JOBS: ${{ toJSON(needs) }}
          CONTRAT: ${{ needs.greffon.outputs.contrat }}
        run: |
          # Transition to judge-v4: a base's verdict.py written for juge-v3 reads the juge-v3 job as « juge », and the
          # juge-ancien job; otherwise both are left out (skipped). The judge job counts in both cases.
          python3 - > resultats-jobs.json <<'FIN'
          import json, os
          jobs = json.loads(os.environ["RESULTATS_JOBS"])
          v3, ancien = jobs.pop("juge-v3", None), jobs.pop("juge-ancien", None)
          if os.environ.get("CONTRAT") == "juge-v3":
              jobs.update({"juge": v3, "juge-ancien": ancien})
          print(json.dumps(jobs))
          FIN
          verdict=base/bee/ci/verdict.py
          juge=artefacts/judge
          if [ "$CONTRAT" = "juge-v3" ]; then juge=artefacts/juge; fi
          if [ "$(cat "$ETATS/greffon.txt")" = "pr" ]; then
            # The same rule as for the plugin: only at bootstrap does the PR bring the assembler.
            echo "::warning::The base has no bee/ (bootstrap): the PR's verdict assembler is used (tooling task, a guardian's review required by the registry)."
            verdict=pr/bee/ci/verdict.py
          fi
          python3 "$verdict" --artefacts artefacts --juge "$juge" --etats "$ETATS" --jobs resultats-jobs.json \
            --depot pr --base "$BASE_SHA" --tete "$TETE_SHA" --sortie verdict.json
          cat verdict.json
      - name: Fallback verdict (base without judges, verdict.py unavailable)
        if: failure() && steps.juges.outcome == 'failure'
        run: |
          printf '%s\n' '{"ci": "red", "failed_step": "Judges (base without bee/)", "gain": null, "metric": null, "beyond_noise": false, "measurements": {"A": {}, "B": {}}, "instructions": null, "degradations": {}, "changed_lines": null, "bootstrap": false}' > verdict.json
          cat verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verdict
          path: verdict.json
          if-no-files-found: error
      - name: CI red if a step failed
        run: |
          python3 -c 'import json, sys; v = json.load(open("verdict.json")); print("CI", v["ci"], v.get("failed_step", v.get("etape_en_echec", ""))); sys.exit(v["ci"] not in ("green", "verte"))'
