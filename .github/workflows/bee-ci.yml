# CI Bee du fork miniz (https://github.com/Bee-ruche/minizBee). Fork indépendant, non affilié au projet miniz.
#
# Étapes, dans l'ordre (la première en échec est rapportée, voir docs/evaluation.md du registre Bee) :
#   1. manifeste et taille : bee verifier-fork, avec l'outil du registre (branche main)
#   2. compilation et tests d'origine de miniz, x86-64 et ARM64
#   3. tests différentiels contre zlib et empreintes de déterminisme, x86-64 et ARM64
#   4. fuzzing libFuzzer, 2 harnais en parallèle pendant 10 minutes, x86-64
#   5. juge isolé (bee/juge/juge.py) : point de départ de la PR (merge-base avec la base) contre tête de
#      la PR ; vérification de toutes les sorties par l'hôte (zlib de l'hôte, entrées tirées au hasard),
#      mesures entrelacées (10 répétitions) et décompte d'instructions Cachegrind, tout en conteneur ;
#      analyse des objets compilés (constructions suspectes)
#   6. méta-tests du juge isolé, seulement si la PR modifie bee/juge/
#   7. verdict.json, publié en artefact « verdict » (lu par le workflow verdicts.yml du registre)
#
# Sécurité :
#   - permissions: contents: read pour tout le workflow ; aucun secret ; checkouts sans identifiants
#     conservés (persist-credentials: false). Déclencheur pull_request (jamais pull_request_target) :
#     pour une PR venant d'un fork, GitHub ne fournit de toute façon ni secret ni jeton en écriture.
#   - les juges (tests, corpus, banc, fuzzing, scripts de CI) viennent de la BASE de la PR ; seules les
#     sources de miniz viennent de la PR, qui ne peut pas assouplir ces fichiers-là.
#   - MAIS ce fichier de workflow est celui de la PR (déclencheur pull_request) : une PR qui modifie
#     .github/ ou bee/ peut fabriquer son propre verdict. Le registre le détecte de son côté (liste des
#     fichiers de la PR lue auprès de l'API GitHub, verdicts.yml) : verdict refusé pour une optimisation,
#     relecture du conseil ou d'un Confirmé exigée pour une tâche d'outillage (R3).
#   - le manifeste (manifestes/<tâche>.yaml) et la tâche du registre sont des données (yaml.safe_load), jamais exécutées ;
#     les valeurs qui en sortent sont validées contre des listes fermées.
#   - « ci » est décidée par le job verdict à partir du résultat des jobs (needs.*.result), que le code
#     de la PR ne peut pas réécrire ; les fichiers d'état servent seulement à nommer l'étape en échec.
#   - le code C de la PR ne s'exécute JAMAIS sur la machine de CI elle-même : compilation, tests,
#     fuzzing et mesures tournent dans le conteneur du juge (bee/juge/isoler.sh, bee/juge/juge.py :
#     sans réseau, lecture seule, sans privilège), sur des copies jetables. L'image est construite avant
#     que le moindre fichier de la PR ne soit monté.
#   - les étapes 2 à 4 restent des contrôles « de l'intérieur » : un code malveillant peut fausser ses
#     propres tests (exit(0) au milieu, par exemple) mais pas en sortir. Le juge isolé (étape 5), lui,
#     vérifie les sorties de l'extérieur, avec des entrées qu'aucun code ne connaît d'avance, et mesure
#     les temps par le noyau : c'est lui qui fait foi. Modèle de menace : bee/README.md, section « Juge isolé ».
name: bee-ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bee-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  TETE_SHA: ${{ github.event.pull_request.head.sha }}
  REGISTRE: Bee-ruche/registre
  ETATS: ${{ github.workspace }}/etats
  # Amorçage : la première PR, qui apporte bee/, a pour base le master d'origine, sans juges.
  # Pour CE commit seulement, les juges viennent de la PR elle-même (verdict : amorcage: true).
  BEE_COMMIT_AMORCAGE: 2948eebafc5b9f1c69bebed80333e403a09bd62d
  # Logique de bee/ci/juges.sh (copie identique, vérifiée par bee/ci/test_verdict.py), exécutée par
  # l'étape « Juges » de chaque job : à l'amorçage, la base ne contient pas encore ce script.
  # Variables attendues : base, pr, base_sha, etats.
  BEE_JUGES: |
    mkdir -p "$etats"
    if [ -f "$base/bee/ci/etape.sh" ] && [ ! -f "$base/bee/juge/juge.py" ] && [ -f "$pr/bee/juge/juge.py" ]; then
      echo "::warning::INTRODUCTION DU JUGE ISOLÉ : la base $base_sha n'a pas encore bee/juge/ ; les juges viennent de la PR qui l'apporte (verdict.json : amorcage: true ; tâche d'outillage, relue par un gardien)."
      rm -rf "$base/bee"
      cp -a "$pr/bee" "$base/bee"
      mkdir -p "$base/.github/workflows"
      cp -a "$pr/.github/workflows/bee-ci.yml" "$base/.github/workflows/bee-ci.yml"
      echo "oui" > "$etats/amorcage.txt"
      echo "succes" > "$etats/juges.txt"
    elif [ -f "$base/bee/ci/etape.sh" ]; then
      echo "Juges : bee/ de la base de la PR ($base_sha)."
      echo "succes" > "$etats/juges.txt"
    elif [ "$base_sha" = "$BEE_COMMIT_AMORCAGE" ] && [ -f "$pr/bee/ci/etape.sh" ]; then
      echo "::warning::AMORÇAGE : la base $base_sha (commit d'amorçage épinglé) ne contient pas bee/ ; les juges viennent de la PR elle-même (verdict.json : amorcage: true)."
      rm -rf "$base/bee"
      cp -a "$pr/bee" "$base/bee"
      mkdir -p "$base/.github/workflows"
      cp -a "$pr/.github/workflows/bee-ci.yml" "$base/.github/workflows/bee-ci.yml"
      echo "oui" > "$etats/amorcage.txt"
      echo "succes" > "$etats/juges.txt"
    else
      echo "echec" > "$etats/juges.txt"
      echo "::error::La base de la PR ($base_sha) ne contient pas bee/ : pas de juges, CI refusée (seul le commit d'amorçage $BEE_COMMIT_AMORCAGE est accepté sans juges)." >&2
      exit 1
    fi

  # Juge isolé : celui de la base (bee/juge/), après l'étape « Juges ».
  BEE_JUGE_ISOLE: |
    juge="$GITHUB_WORKSPACE/base/bee/juge"
    echo "JUGE=$juge" >> "$GITHUB_ENV"
    echo "IMAGE=$(python3 "$juge/juge.py" --image-seulement --outillage "$GITHUB_WORKSPACE/base")" >> "$GITHUB_ENV"
  # Copie de travail jetable pour une étape conteneurisée : la base et la PR, fraîches.
  BEE_TRAVAIL: |
    travail="$RUNNER_TEMP/travail-$1"
    rm -rf "$travail"
    mkdir -p "$travail"
    cp -a base "$travail/base"
    cp -a pr "$travail/pr"
    echo "$travail"

jobs:
  manifeste:
    name: Manifeste et taille
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tache: ${{ steps.manifeste.outputs.tache }}
      type: ${{ steps.manifeste.outputs.type }}
      metrique: ${{ steps.manifeste.outputs.metrique }}
      sortie_compressee: ${{ steps.manifeste.outputs.sortie_compressee }}
    steps:
      - name: Base de la PR (juges)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Tête de la PR (historique complet, pour le diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Registre Bee (branche main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: main
          path: registre
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dépendances de l'outil bee
        run: pip install -r registre/outils/requirements.txt
      - name: Tests unitaires de l'outillage de la base (ab.py, verdict.py)
        run: |
          python3 base/bee/bench/test_ab.py
          python3 base/bee/ci/test_verdict.py
          if [ -f base/bee/bench/test_profil.py ]; then python3 base/bee/bench/test_profil.py; fi
      - name: Manifeste, tâche, R1 et commandement 3
        id: manifeste
        env:
          AUTEUR: ${{ github.event.pull_request.user.login }}
          BEE_SORTIE_TACHE: ${{ github.workspace }}/donnees/tache.yaml
        run: |
          mkdir -p donnees
          base/bee/ci/etape.sh "$ETATS" manifeste_et_taille base/bee/ci/manifeste.sh pr registre python3
      - name: Conserver le manifeste, la tâche et l'état
        if: always()
        env:
          MANIFESTE: ${{ steps.manifeste.outputs.manifeste }}
        run: |
          mkdir -p donnees
          # Nom validé par bee/ci/manifeste.sh (manifestes/miniz-NNNN.yaml ou CONTRIBUTION.yaml).
          case "$MANIFESTE" in
            manifestes/miniz-[0-9][0-9][0-9][0-9].yaml|CONTRIBUTION.yaml) cp "pr/$MANIFESTE" donnees/CONTRIBUTION.yaml 2>/dev/null || true ;;
          esac
          cp -r "$ETATS" donnees/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-manifeste
          path: donnees/
          if-no-files-found: warn

  compilation-et-tests:
    name: Compilation et tests (${{ matrix.arch }})
    needs: manifeste
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            machine: ubuntu-24.04
          - arch: arm64
            machine: ubuntu-24.04-arm
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 30
    steps:
      - name: Base de la PR (juges ; historique complet pour le corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Image du conteneur du juge (seule étape avec réseau, avant d'exécuter quoi que ce soit de la PR)
        run: eval "$BEE_JUGE_ISOLE"
      - name: Compilation et tests d'origine de miniz (conteneur sans réseau)
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- compilation)"
          base/bee/ci/etape.sh "$ETATS" compilation_${{ matrix.arch }} "$JUGE/isoler.sh" "$IMAGE" "$travail" -- \
            /travail/base/bee/ci/tests_origine.sh /travail/pr /travail/cmake
      - name: Tests différentiels et empreintes (conteneur sans réseau)
        if: always()
        env:
          SORTIE_COMPRESSEE: ${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- differentiel)"
          base/bee/ci/etape.sh "$ETATS" differentiel_${{ matrix.arch }} "$JUGE/isoler.sh" "$IMAGE" "$travail" -- \
            env SORTIE_COMPRESSEE="$SORTIE_COMPRESSEE" BASE_SHA="$BASE_SHA" TETE_SHA="$TETE_SHA" \
            /travail/base/bee/ci/differentiel.sh /travail/pr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-tests-${{ matrix.arch }}
          path: etats/
          if-no-files-found: warn

  fuzzing:
    name: Fuzzing 10 minutes (x86-64)
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Base de la PR (harnais ; historique complet pour le corpus de graines)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Image du conteneur du juge (seule étape avec réseau, avant d'exécuter quoi que ce soit de la PR)
        run: eval "$BEE_JUGE_ISOLE"
      # Les entrées fautives, les journaux de libFuzzer et les traces ne quittent JAMAIS la machine de
      # CI : journaux et artefacts d'un dépôt public sont publics (docs/securite.md du registre).
      # lancer.sh est en mode discret sous GitHub Actions (empreintes seulement) et rejoue chaque
      # entrée fautive sur la base : un écart qui y existe déjà est signalé sans compter contre la PR.
      - name: Fuzzing différentiel, 2 harnais en parallèle, 600 s chacun (conteneur sans réseau)
        run: |
          travail="$(bash -c "$BEE_TRAVAIL" -- fuzzing)"
          base/bee/ci/etape.sh "$ETATS" fuzzing "$JUGE/isoler.sh" "$IMAGE" "$travail" -- \
            env CLANG=clang-18 BEE_FUZZ_SORTIES=/travail/sorties-fuzz BEE_FUZZ_DISCRET=1 GITHUB_ACTIONS=true \
            /travail/base/bee/fuzz/lancer.sh 600 --source /travail/pr --reference /travail/base
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-fuzzing
          path: etats/
          if-no-files-found: warn

  juge:
    name: Juge isolé (x86-64)
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Base de la PR (juge ; historique complet pour le corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR (historique complet, qui contient le point de départ et la tête)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Image du conteneur du juge (seule étape avec réseau, avant d'exécuter quoi que ce soit de la PR)
        run: eval "$BEE_JUGE_ISOLE"
      - name: Juge isolé — A = point de départ de la PR, B = tête ; vérification, 10 répétitions, instructions
        env:
          SORTIE_COMPRESSEE: ${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}
        run: |
          depart="$(git -C pr merge-base "$BASE_SHA" "$TETE_SHA")"
          echo "A = point de départ de la PR $depart (base $BASE_SHA), B = tête $TETE_SHA"
          git -C pr worktree add --detach "$RUNNER_TEMP/source-a" "$depart"
          git -C pr worktree add --detach "$RUNNER_TEMP/source-b" "$TETE_SHA"
          base/bee/ci/etape.sh "$ETATS" juge_isole \
            python3 "$JUGE/juge.py" --outillage base \
              --source-a "$RUNNER_TEMP/source-a" --source-b "$RUNNER_TEMP/source-b" \
              --sortie-compressee "$SORTIE_COMPRESSEE" --repetitions 10 \
              --depot-diff pr --base "$depart" --tete "$TETE_SHA" --json "$GITHUB_WORKSPACE/conserver/juge.json"
      - name: Conserver l'état
        if: always()
        run: |
          mkdir -p conserver
          cp -r "$ETATS" conserver/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-juge
          path: conserver/
          if-no-files-found: warn

  meta-juge:
    name: Méta-tests du juge isolé
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Base de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR (historique complet, pour le diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      # Le juge d'une PR qui modifie bee/juge/ est celui de la PR : il doit prouver qu'il attrape des
      # variantes malveillantes de miniz (bee/juge/test_juge.py), compilées et lancées en conteneur.
      - name: Méta-tests (seulement si la PR modifie bee/juge/)
        run: |
          if git -C pr diff --quiet "$BASE_SHA...$TETE_SHA" -- bee/juge; then
            echo "bee/juge/ inchangé par la PR : pas de méta-tests."
            mkdir -p "$ETATS" && echo "succes" > "$ETATS/meta_juge.txt"
            exit 0
          fi
          base/bee/ci/etape.sh "$ETATS" meta_juge env BEE_JUGE_INTEGRATION=1 python3 pr/bee/juge/test_juge.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-meta-juge
          path: etats/
          if-no-files-found: warn

  verdict:
    name: Verdict
    needs: [manifeste, compilation-et-tests, fuzzing, juge, meta-juge]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Base de la PR (verdict.py)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Historique de la PR (lu par git diff seulement, pour compter les lignes)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        id: juges
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PyYAML (lecture du manifeste et de la tâche)
        run: pip install "pyyaml==6.0.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: etat-*
          path: artefacts
      - name: Assembler verdict.json
        env:
          RESULTATS_JOBS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTATS_JOBS" > resultats-jobs.json
          python3 base/bee/ci/verdict.py --artefacts artefacts --etats "$ETATS" --jobs resultats-jobs.json \
            --depot pr --base "$BASE_SHA" --tete "$TETE_SHA" --sortie verdict.json
          cat verdict.json
      - name: Verdict de repli (base sans juges, verdict.py indisponible)
        if: failure() && steps.juges.outcome == 'failure'
        run: |
          printf '%s\n' '{"ci": "rouge", "etape_en_echec": "Juges (base sans bee/)", "gain": null, "metrique": null, "au_dela_du_bruit": false, "mesures": {"A": {}, "B": {}}, "instructions": null, "degradations": {}, "lignes_modifiees": null, "amorcage": false}' > verdict.json
          cat verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verdict
          path: verdict.json
          if-no-files-found: error
      - name: CI rouge si une étape a échoué
        run: |
          python3 -c 'import json, sys; v = json.load(open("verdict.json")); print("CI", v["ci"], v.get("etape_en_echec", "")); sys.exit(v["ci"] != "verte")'
