# CI Bee du fork miniz (https://github.com/Bee-ruche/minizBee). Fork indépendant, non affilié au projet miniz.
#
# Étapes, dans l'ordre (la première en échec est rapportée, voir docs/evaluation.md du registre Bee) :
#   1. manifeste et taille : bee verifier-fork, avec l'outil du registre (branche main)
#   2. compilation et tests d'origine de miniz, x86-64 et ARM64
#   3. tests différentiels contre zlib et empreintes de déterminisme, x86-64 et ARM64
#   4. fuzzing libFuzzer, 2 harnais en parallèle pendant 10 minutes, x86-64
#   5. banc A/B entrelacé : point de départ de la PR (merge-base avec la base) contre tête de la PR,
#      10 répétitions, avec décompte d'instructions Cachegrind sur un sous-corpus
#   6. verdict.json, publié en artefact « verdict » (lu par le workflow verdicts.yml du registre)
#
# Sécurité :
#   - permissions: contents: read pour tout le workflow ; aucun secret ; checkouts sans identifiants
#     conservés (persist-credentials: false). Déclencheur pull_request (jamais pull_request_target) :
#     pour une PR venant d'un fork, GitHub ne fournit de toute façon ni secret ni jeton en écriture.
#   - les juges (tests, corpus, banc, fuzzing, scripts de CI) viennent de la BASE de la PR ; seules les
#     sources de miniz viennent de la PR, qui ne peut pas assouplir ces fichiers-là.
#   - MAIS ce fichier de workflow est celui de la PR (déclencheur pull_request) : une PR qui modifie
#     .github/ ou bee/ peut fabriquer son propre verdict. Le registre le détecte de son côté (liste des
#     fichiers de la PR lue auprès de l'API GitHub, verdicts.yml) : verdict refusé pour une optimisation,
#     relecture du conseil ou d'un Confirmé exigée pour une tâche d'outillage (R3).
#   - le manifeste (manifestes/<tâche>.yaml) et la tâche du registre sont des données (yaml.safe_load), jamais exécutées ;
#     les valeurs qui en sortent sont validées contre des listes fermées.
#   - « ci » est décidée par le job verdict à partir du résultat des jobs (needs.*.result), que le code
#     de la PR ne peut pas réécrire ; les fichiers d'état servent seulement à nommer l'étape en échec.
#   - limite connue : un code de PR qui détourne le processus qui l'exécute (exit(0) dans un
#     constructeur, par exemple) peut fausser l'étape qui l'exécute. C'est le rôle de la relecture
#     humaine (R3) ; les relecteurs rejouent les mesures.
name: bee-ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bee-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  TETE_SHA: ${{ github.event.pull_request.head.sha }}
  REGISTRE: Bee-ruche/registre
  ETATS: ${{ github.workspace }}/etats
  # Amorçage : la première PR, qui apporte bee/, a pour base le master d'origine, sans juges.
  # Pour CE commit seulement, les juges viennent de la PR elle-même (verdict : amorcage: true).
  BEE_COMMIT_AMORCAGE: 2948eebafc5b9f1c69bebed80333e403a09bd62d
  # Logique de bee/ci/juges.sh (copie identique, vérifiée par bee/ci/test_verdict.py), exécutée par
  # l'étape « Juges » de chaque job : à l'amorçage, la base ne contient pas encore ce script.
  # Variables attendues : base, pr, base_sha, etats.
  BEE_JUGES: |
    mkdir -p "$etats"
    if [ -f "$base/bee/ci/etape.sh" ]; then
      echo "Juges : bee/ de la base de la PR ($base_sha)."
      echo "succes" > "$etats/juges.txt"
    elif [ "$base_sha" = "$BEE_COMMIT_AMORCAGE" ] && [ -f "$pr/bee/ci/etape.sh" ]; then
      echo "::warning::AMORÇAGE : la base $base_sha (commit d'amorçage épinglé) ne contient pas bee/ ; les juges viennent de la PR elle-même (verdict.json : amorcage: true)."
      rm -rf "$base/bee"
      cp -a "$pr/bee" "$base/bee"
      mkdir -p "$base/.github/workflows"
      cp -a "$pr/.github/workflows/bee-ci.yml" "$base/.github/workflows/bee-ci.yml"
      echo "oui" > "$etats/amorcage.txt"
      echo "succes" > "$etats/juges.txt"
    else
      echo "echec" > "$etats/juges.txt"
      echo "::error::La base de la PR ($base_sha) ne contient pas bee/ : pas de juges, CI refusée (seul le commit d'amorçage $BEE_COMMIT_AMORCAGE est accepté sans juges)." >&2
      exit 1
    fi

jobs:
  manifeste:
    name: Manifeste et taille
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tache: ${{ steps.manifeste.outputs.tache }}
      type: ${{ steps.manifeste.outputs.type }}
      metrique: ${{ steps.manifeste.outputs.metrique }}
      sortie_compressee: ${{ steps.manifeste.outputs.sortie_compressee }}
    steps:
      - name: Base de la PR (juges)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Tête de la PR (historique complet, pour le diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Registre Bee (branche main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: main
          path: registre
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dépendances de l'outil bee
        run: pip install -r registre/outils/requirements.txt
      - name: Tests unitaires de l'outillage de la base (ab.py, verdict.py)
        run: |
          python3 base/bee/bench/test_ab.py
          python3 base/bee/ci/test_verdict.py
      - name: Manifeste, tâche, R1 et commandement 3
        id: manifeste
        env:
          AUTEUR: ${{ github.event.pull_request.user.login }}
          BEE_SORTIE_TACHE: ${{ github.workspace }}/donnees/tache.yaml
        run: |
          mkdir -p donnees
          base/bee/ci/etape.sh "$ETATS" manifeste_et_taille base/bee/ci/manifeste.sh pr registre python3
      - name: Conserver le manifeste, la tâche et l'état
        if: always()
        env:
          MANIFESTE: ${{ steps.manifeste.outputs.manifeste }}
        run: |
          mkdir -p donnees
          # Nom validé par bee/ci/manifeste.sh (manifestes/miniz-NNNN.yaml ou CONTRIBUTION.yaml).
          case "$MANIFESTE" in
            manifestes/miniz-[0-9][0-9][0-9][0-9].yaml|CONTRIBUTION.yaml) cp "pr/$MANIFESTE" donnees/CONTRIBUTION.yaml 2>/dev/null || true ;;
          esac
          cp -r "$ETATS" donnees/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-manifeste
          path: donnees/
          if-no-files-found: warn

  compilation-et-tests:
    name: Compilation et tests (${{ matrix.arch }})
    needs: manifeste
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            machine: ubuntu-24.04
          - arch: arm64
            machine: ubuntu-24.04-arm
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 30
    steps:
      - name: Base de la PR (juges ; historique complet pour le corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Outils (gcc, g++, cmake, zlib1g-dev)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends build-essential cmake zlib1g-dev
      - name: Compilation et tests d'origine de miniz
        run: base/bee/ci/etape.sh "$ETATS" compilation_${{ matrix.arch }} base/bee/ci/tests_origine.sh pr "$RUNNER_TEMP/cmake"
      - name: Tests différentiels et empreintes
        if: always()
        env:
          SORTIE_COMPRESSEE: ${{ needs.manifeste.outputs.sortie_compressee || 'identique' }}
        run: base/bee/ci/etape.sh "$ETATS" differentiel_${{ matrix.arch }} base/bee/ci/differentiel.sh pr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-tests-${{ matrix.arch }}
          path: etats/
          if-no-files-found: warn

  fuzzing:
    name: Fuzzing 10 minutes (x86-64)
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Base de la PR (harnais ; historique complet pour le corpus de graines)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Outils (clang 18 et son runtime libFuzzer, zlib1g-dev)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends clang-18 libclang-rt-18-dev zlib1g-dev
      # Les entrées fautives, les journaux de libFuzzer et les traces ne quittent JAMAIS la machine de
      # CI : journaux et artefacts d'un dépôt public sont publics (docs/securite.md du registre).
      # lancer.sh est en mode discret sous GitHub Actions (empreintes seulement) et rejoue chaque
      # entrée fautive sur la base : un écart qui y existe déjà est signalé sans compter contre la PR.
      - name: Fuzzing différentiel, 2 harnais en parallèle, 600 s chacun
        env:
          CLANG: clang-18
          BEE_FUZZ_SORTIES: ${{ runner.temp }}/sorties-fuzz
          BEE_FUZZ_DISCRET: "1"
        run: base/bee/ci/etape.sh "$ETATS" fuzzing base/bee/fuzz/lancer.sh 600 --source pr --reference base
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-fuzzing
          path: etats/
          if-no-files-found: warn

  banc-ab:
    name: Banc A/B
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Base de la PR (banc ; historique complet pour le corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: Tête de la PR (historique complet, qui contient base et tête, pour les git worktree d'ab.py)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Outils (gcc, valgrind, zlib1g-dev)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends build-essential valgrind zlib1g-dev
      - name: Banc A/B entrelacé, 10 répétitions, avec instructions
        run: |
          depart="$(git -C pr merge-base "$BASE_SHA" "$TETE_SHA")"
          echo "A = point de départ de la PR $depart (base $BASE_SHA), B = tête $TETE_SHA"
          base/bee/ci/etape.sh "$ETATS" banc_ab \
            python3 base/bee/bench/ab.py --depot pr --base "$depart" --candidate "$TETE_SHA" \
              --repetitions 10 --instructions --json "$GITHUB_WORKSPACE/conserver/ab.json"
      - name: Conserver l'état
        if: always()
        run: |
          mkdir -p conserver
          cp -r "$ETATS" conserver/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-banc
          path: conserver/
          if-no-files-found: warn

  verdict:
    name: Verdict
    needs: [manifeste, compilation-et-tests, fuzzing, banc-ab]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Base de la PR (verdict.py)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: Historique de la PR (lu par git diff seulement, pour compter les lignes)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Juges (bee/ de la base, ou de la PR en amorçage)
        id: juges
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PyYAML (lecture du manifeste et de la tâche)
        run: pip install "pyyaml==6.0.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: etat-*
          path: artefacts
      - name: Assembler verdict.json
        env:
          RESULTATS_JOBS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTATS_JOBS" > resultats-jobs.json
          python3 base/bee/ci/verdict.py --artefacts artefacts --etats "$ETATS" --jobs resultats-jobs.json \
            --depot pr --base "$BASE_SHA" --tete "$TETE_SHA" --sortie verdict.json
          cat verdict.json
      - name: Verdict de repli (base sans juges, verdict.py indisponible)
        if: failure() && steps.juges.outcome == 'failure'
        run: |
          printf '%s\n' '{"ci": "rouge", "etape_en_echec": "Juges (base sans bee/)", "gain": null, "metrique": null, "au_dela_du_bruit": false, "mesures": {"A": {}, "B": {}}, "instructions": null, "degradations": {}, "lignes_modifiees": null, "amorcage": false}' > verdict.json
          cat verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verdict
          path: verdict.json
          if-no-files-found: error
      - name: CI rouge si une étape a échoué
        run: |
          python3 -c 'import json, sys; v = json.load(open("verdict.json")); print("CI", v["ci"], v.get("etape_en_echec", "")); sys.exit(v["ci"] != "verte")'
