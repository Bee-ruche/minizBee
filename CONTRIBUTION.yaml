doutes: "Les métriques de compression varient de -4,8 % à +1,5 % d'un passage à l'autre (deux passages) alors que le code de compression n'est pas touché et que leurs instructions sont strictement identiques : c'est du bruit de machine partagée, aucune dégradation au-delà du bruit n'est signalée par ab.py. Le gain de 8 à 10 % dépend du fait que le compilateur garde les multiplications 64 bits en registres ; sur un ARM64 ou un compilateur autre, le gain peut être plus faible, mais le chemin ne devrait pas être plus lent que la boucle de 8 octets."
