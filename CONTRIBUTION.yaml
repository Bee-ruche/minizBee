resume: "tinfl_decompress : Adler-32 de la sortie par blocs de 16 octets en arithmétique 64 bits (voies de 16 bits), même valeur qu'avant."
changement: >
  La boucle d'Adler-32 de fin de tinfl_decompress (miniz_tinfl.c) traitait 8 octets par tour avec deux chaînes de
  dépendances de 1 cycle par octet (s1 puis s2), soit environ 1 octet par cycle. Elle traite maintenant 16 octets par
  tour : deux mots de 64 bits lus par memcpy, octets pairs et impairs séparés par masque dans des voies de 16 bits, puis
  un produit par une constante donne en voie haute la somme des octets (s1) et leur somme pondérée (s2). On a
  s1 += a0 + a1 et s2 += 16*s1 + 8*a0 + d0 + d1, ce qui est exactement ce que calcule la boucle octet par octet :
  mêmes entiers avant la réduction modulo 65521. Le bloc de 5552 octets (borne de zlib), la réduction modulo et la boucle
  de 8 octets puis d'1 octet pour le reste sont inchangés. Le code n'est compilé que si MINIZ_LITTLE_ENDIAN et
  MINIZ_HAS_64BIT_REGISTERS valent 1 ; sinon (grand-boutiste, registres 32 bits) l'ancienne boucle s'exécute seule.
  Absence de débordement : les voies de 16 bits ne dépassent pas 2 * 255 * 36 = 18360 (somme des poids 8+6+4+2+7+5+3+1,
  deux mots), donc aucune retenue entre voies ; s1 et s2 (32 bits) restent sous 2^32 sur 5552 octets, car chaque quantité
  ajoutée est un terme positif de l'accroissement séquentiel sur 16 octets, et la borne de zlib 255*n*(n+1)/2 + (n+1)*65520
  = 4 294 690 200 < 2^32 - 1 pour n = 5552 (elle dépasse pour n = 5553). Lectures par memcpy (pas de transtypage de pointeur),
  jamais au-delà de ptr + block_len.
