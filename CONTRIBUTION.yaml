resume: "Sortie des codes de Huffman par mots de 64 bits dans tdefl_compress_lz_codes."
changement: >
  Active la variante 64 bits de tdefl_compress_lz_codes (déjà présente dans miniz, mais compilée
  seulement sous MINIZ_USE_UNALIGNED_LOADS_AND_STORES) au moyen d'un nouveau gate propre à la
  compression, TDEFL_USE_64BIT_BITBUF, défini sur plateforme petit-boutiste à registres 64 bits et
  indépendant de MINIZ_USE_UNALIGNED_LOADS_AND_STORES (qui concerne aussi la décompression, hors
  périmètre). Les codes sont accumulés dans un registre 64 bits et écrits 8 octets à la fois par
  memcpy (aucun transtypage de pointeur) ; seuls bits_in>>3 octets sont avancés, les octets en trop
  tombent dans la marge de 16 octets de m_pOutput_buf_end. La variante générique reste le repli. La
  sortie compressée est strictement identique à celle de la variante générique.
