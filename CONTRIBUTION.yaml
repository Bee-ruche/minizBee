resume: "Comparaison des correspondances par mots de 64 bits dans tdefl_find_match."
changement: >
  Dans la variante par défaut de tdefl_find_match, la boucle interne qui mesure la longueur d'une
  correspondance passe d'une comparaison octet par octet à un XOR de mots de 64 bits (lus par memcpy,
  aucun transtypage) suivi de __builtin_ctzll pour trouver le premier octet différent. La boucle de
  mots ne tourne que tant qu'il reste au moins 8 octets sous le plafond max_match_len, puis la fin se
  fait octet par octet : elle calcule donc EXACTEMENT la même longueur que la comparaison octet par
  octet, ne touche pas à la sélection des sondes, et ne lit jamais au-delà de max_match_len octets
  (donc jamais au-delà du dictionnaire). Mêmes correspondances choisies, sortie compressée identique.
  Gate TDEFL_FIND_MATCH_64BIT (petit-boutiste + registres 64 bits + GCC/Clang) ; repli octet par octet.
